<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5C3D1E">
<meta name="robots" content="noindex,nofollow">
<title>새끼 생후일수 · 골디쉼터</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235C3D1E'/%3E%3Ctext x='50' y='66' font-size='56' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3ED%2B%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#FAF7F2; --card:#fff; --br:#5C3D1E; --gold:#C8931A; --gray:#8B7E6F; --line:#E8E1D6;
  --a:#C8931A; --b:#2E7D6B; --d:#8E5BB5; --late:#D14B3A;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1C1812; --card:#2A241B; --br:#F1E3CC; --gold:#E0AA3A; --gray:#B3A691; --line:#43392B; --a:#E0AA3A; --b:#4DB89F; --d:#B58BDB; --late:#F0705E; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg); color:var(--br);
  padding:env(safe-area-inset-top,0) 14px calc(24px + env(safe-area-inset-bottom,0)) 14px;
  max-width:560px; margin:0 auto;
}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 10px}
header h1{font-size:19px;font-weight:800}
header .today{font-size:12px;color:var(--gray);margin-top:3px}
#refreshBtn{
  border:1.5px solid var(--line);background:var(--card);color:var(--br);
  border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer
}
#refreshBtn:active{transform:scale(.97)}
#status{font-size:12px;color:var(--gray);padding:0 2px 10px;min-height:18px}
#status.err{color:#D14B3A;font-weight:700}
.litter{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.l-title{font-size:17px;font-weight:800}
.l-sub{font-size:12px;color:var(--gray);margin-top:3px}
.badges{display:flex;gap:10px;margin-top:14px}
.badge{flex:1;border-radius:14px;padding:12px 8px;text-align:center;border:2px solid var(--line)}
.badge.a{border-color:var(--a)}
.badge.b{border-color:var(--b)}
.badge .lbl{font-size:12px;font-weight:800;letter-spacing:.02em}
.badge.a .lbl{color:var(--a)}
.badge.b .lbl{color:var(--b)}
.badge .dn{font-size:34px;font-weight:900;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.badge .wk{font-size:12px;font-weight:700;margin-top:1px}
.badge .dt{font-size:11px;color:var(--gray);margin-top:3px}
.nob{font-size:11px;color:var(--gray);text-align:center;margin-top:8px}
.sec{font-size:13px;font-weight:800;color:var(--gray);margin:6px 2px 10px;letter-spacing:.02em}
.badge.d{border-color:var(--d)}
.badge.d .lbl{color:var(--d)}
.badge.late{border-color:var(--late)}
.badge.late .lbl,.badge.late .dn{color:var(--late)}
.range{font-size:12px;color:var(--gray);text-align:center;margin-top:9px}
.pups{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.pup{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:5px 10px;display:flex;gap:5px;align-items:center}
.pup .m{color:#3B82C4}.pup .f{color:#D9578F}
.pup .st{color:var(--gray);font-size:11px}
.pup.sold{opacity:.65}
.pup.rsv{border-color:var(--gold)}
.empty{text-align:center;color:var(--gray);padding:40px 10px;font-size:14px;line-height:1.7}


#panelBtn{
  border:1.5px solid var(--line);background:var(--card);color:var(--br);
  border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer
}
.hbtns{display:flex;gap:8px}
#newNotice{
  display:none;background:rgba(200,147,26,.14);border:1.5px solid var(--gold);color:var(--br);
  border-radius:12px;padding:11px 13px;font-size:13px;font-weight:700;margin-bottom:12px;cursor:pointer
}
#panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
#panel h2{font-size:14px;font-weight:800}
#panel .hint{font-size:11px;color:var(--gray);margin:4px 0 10px;line-height:1.5}
.opt{display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.opt input{width:22px;height:22px;accent-color:var(--gold);flex:none}
.opt .t{font-size:14px;font-weight:800}
.opt .s{font-size:11px;color:var(--gray);display:block;margin-top:2px}
.opt em{font-style:normal;font-size:10px;font-weight:800;background:var(--gold);color:#fff;border-radius:99px;padding:2px 7px;margin-left:6px}
#panelClose{
  width:100%;margin-top:10px;border:0;background:var(--br);color:var(--bg);
  border-radius:10px;padding:12px;font-size:14px;font-weight:800;cursor:pointer
}
</style>
</head>
<body>

<header>
  <div>
    <h1>🐶 새끼 생후일수</h1>
    <div class="today" id="today"></div>
  </div>
  <div class="hbtns">
    <button id="panelBtn" onclick="togglePanel()">⚙️ 배 선택</button>
    <button id="refreshBtn" onclick="load(true)">🔄</button>
  </div>
</header>
<div id="status">불러오는 중…</div>
<div id="newNotice" onclick="togglePanel(true)"></div>
<div id="panel">
  <h2>표시할 배 선택</h2>
  <div class="hint">체크한 배만 화면에 나옵니다. 이 폰에 저장되고, 직접 바꾸기 전까지 유지돼요.<br>새로 등록된 배는 자동으로 추가되지 않습니다.</div>
  <div id="opts"></div>
  <button id="panelClose" onclick="togglePanel(false)">닫기</button>
</div>
<div id="list"></div>

<script>
// ───────── 설정 ─────────
const DB = 'https://goldie-shelter-d6c81-default-rtdb.firebaseio.com';

// ───────── 날짜 계산 (D+0 = 출산일 당일, 구충·접종 일정 계산과 동일 기준) ─────────
function todayUTC(){ const n=new Date(); return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()); }
function dateUTC(str){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(str||''));
  return m ? Date.UTC(+m[1],+m[2]-1,+m[3]) : null;
}
function daysSince(str){ const d=dateUTC(str); return d==null?null:Math.round((todayUTC()-d)/86400000); }
function weekText(n){ if(n<0) return ''; const w=Math.floor(n/7), d=n%7; return w+'주 '+d+'일'; }
function fmt(str){ const d=dateUTC(str); if(d==null) return '—'; const x=new Date(d); return x.getUTCFullYear()+'.'+String(x.getUTCMonth()+1).padStart(2,'0')+'.'+String(x.getUTCDate()).padStart(2,'0'); }
function daysBetween(a,b){ const x=dateUTC(a), y=dateUTC(b); return (x==null||y==null)?null:Math.round((x-y)/86400000); }
function fmtShort(str){ const d=dateUTC(str); if(d==null) return '—'; const x=new Date(d); return String(x.getUTCMonth()+1).padStart(2,'0')+'.'+String(x.getUTCDate()).padStart(2,'0'); }
function dLabel(n){ if(n==null) return '—'; if(n<0) return 'D'+n; return 'D+'+n; }

// ───────── 네트워크 ─────────
async function rest(path){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),15000);
  try{
    const q=path.indexOf('?');
    const url=DB+'/'+(q<0?path:path.slice(0,q))+'.json'+(q<0?'':path.slice(q));   // 쿼리스트링은 .json 뒤에 붙여야 한다
    const r=await fetch(url,{signal:ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function cleanName(code){
  const s=String(code==null?'':code).trim();
  if(!s) return '';
  return s.includes('/') ? s.split('/').pop().trim() : s;
}

let femaleMapPromise=null;      // 모견 목록은 한 번만 불러오고, 동시에 조회하는 배들이 같은 결과를 기다린다
function loadFemaleMap(){
  if(!femaleMapPromise){
    femaleMapPromise=(async()=>{
      const map={};
      const keys=await rest('females?shallow=true');
      await Promise.all(Object.keys(keys||{}).map(async k=>{
        try{
          const [cd,nm]=await Promise.all([rest('females/'+encodeURIComponent(k)+'/code'),rest('females/'+encodeURIComponent(k)+'/name')]);
          if(cd!=null && nm) map[String(cd).trim()]=cleanName(nm);
        }catch(e){}
      }));
      return map;
    })();
    femaleMapPromise.catch(()=>{ femaleMapPromise=null; });   // 실패하면 다음에 다시 시도
  }
  return femaleMapPromise;
}
async function femaleNameByCode(code){
  const c=String(code==null?'':code).trim();
  if(!c) return '';
  if(c.includes('/')) return cleanName(c);
  const map=await loadFemaleMap();
  return map[c]||c;
}

// 사진 등 무거운 필드를 피하려고 필요한 값만 하나씩 읽는다
let allLitterKeys=[];
async function fetchHeads(){
  const keys=Object.keys(await rest('litters?shallow=true')||{});
  allLitterKeys=keys;
  const list=(await Promise.all(keys.map(async k=>{
    try{
      const [a,b,fc]=await Promise.all([rest('litters/'+k+'/birthA'),rest('litters/'+k+'/birthB'),rest('litters/'+k+'/femaleCode')]);
      return {key:k,birthA:a||'',birthB:b||'',femaleCode:fc==null?'':String(fc)};
    }catch(e){ return null; }
  }))).filter(h=>h && (h.birthA||h.birthB));
  const names=await Promise.all(list.map(h=>femaleNameByCode(h.femaleCode).catch(()=>cleanName(h.femaleCode))));
  list.forEach((h,i)=>{ h.femaleName=names[i]; });
  return list;
}
async function fetchDetail(h){
  const [mc,pids]=await Promise.all([
    rest('litters/'+h.key+'/maleCode'),
    rest('litters/'+h.key+'/puppies?shallow=true')
  ]);
  const puppies=(await Promise.all(Object.keys(pids||{}).map(async pid=>{
    try{
      const base='litters/'+h.key+'/puppies/'+pid+'/';
      const [name,sex,status,promoted]=await Promise.all([rest(base+'name'),rest(base+'sex'),rest(base+'status'),rest(base+'promoted_to')]);
      return {id:pid,name:name||'',sex:sex||'',status:promoted?'승격됨':(status||'분양 전')};
    }catch(e){ return null; }
  }))).filter(Boolean).sort((x,y)=>String(x.name).localeCompare(String(y.name),'ko',{numeric:true}));
  return {maleName:cleanName(mc),puppies};
}

// 출산 예정 (번식 기록): 구글 캘린더 동기화와 같은 기준 — 출산 처리된 기록은 제외
const DUE_PAST_DAYS=30;      // 예정일이 지났는데 출산 처리가 안 된 건은 30일까지만 '지연'으로 표시
const DUE_FUTURE_DAYS=90;    // 앞으로 90일까지 (캘린더 동기화와 동일)
async function fetchDue(headsList){
  const keys=Object.keys(await rest('breeding?shallow=true')||{});
  const lite=(await Promise.all(keys.map(async k=>{
    try{
      const [due,born]=await Promise.all([rest('breeding/'+k+'/dueDate'),rest('breeding/'+k+'/bornLitterKey')]);
      return {key:k,dueDate:due||'',bornLitterKey:born||''};
    }catch(e){ return null; }
  }))).filter(Boolean);
  const litterSet=new Set(allLitterKeys);
  const cand=lite.filter(b=>{
    if(!b.dueDate) return false;
    if(b.bornLitterKey && litterSet.has(b.bornLitterKey)) return false;   // 출산 완료 처리됨
    const n=-daysSince(b.dueDate);                                         // 예정일까지 남은 날
    return !isNaN(n) && n>=-DUE_PAST_DAYS && n<=DUE_FUTURE_DAYS;
  });
  const out=(await Promise.all(cand.map(async b=>{
    try{
      const base='breeding/'+b.key+'/';
      const [fc,mc,e,l]=await Promise.all([rest(base+'femaleCode'),rest(base+'maleCode'),rest(base+'dueDateEarliest'),rest(base+'dueDateLatest')]);
      const f=String(fc==null?'':fc).trim();
      // 출산 처리 표시가 빠졌어도, 같은 모견의 새끼가 예정일 앞뒤 3주 안에 태어나 있으면 이미 출산한 것으로 본다
      const already=headsList.some(h=>String(h.femaleCode||'').trim()===f && h.birthA && Math.abs(daysBetween(h.birthA,b.dueDate))<=21);
      if(already) return null;
      const femaleName=await femaleNameByCode(fc).catch(()=>cleanName(fc));
      return {key:b.key,dueDate:b.dueDate,earliest:e||'',latest:l||'',femaleName,maleName:cleanName(mc)};
    }catch(err){ return null; }
  }))).filter(Boolean);
  return out.sort((x,y)=>String(x.dueDate).localeCompare(String(y.dueDate)));
}

// ───────── 상태: 전체 배(heads), 선택한 배의 상세(details), 내가 고른 선택(sel) ─────────
let heads=[];            // 모든 배의 요약 (출산일, 모견 이름)
let dueList=[];          // 출산 예정 (번식 기록)
let details={};          // 배 key → {maleName, puppies}  (선택된 배만 불러옴)
let sel=null;            // {selected:[key...], known:[key...]}  ← 이 폰에 저장, 내가 바꾸기 전엔 그대로
const SEL_KEY='goldi_puppy_age_sel_v1';
const CACHE_KEY2='goldi_puppy_age_cache_v2';

function loadSel(){
  try{ const v=JSON.parse(localStorage.getItem(SEL_KEY)||'null'); if(v&&Array.isArray(v.selected)&&Array.isArray(v.known)) return v; }catch(e){}
  return null;
}
function saveSel(){ try{ localStorage.setItem(SEL_KEY,JSON.stringify(sel)); }catch(e){} }
function saveCache(){ try{ localStorage.setItem(CACHE_KEY2,JSON.stringify({heads,details,dueList})); }catch(e){} }
function loadCache(){
  try{ const c=JSON.parse(localStorage.getItem(CACHE_KEY2)||'null'); if(c&&Array.isArray(c.heads)){ heads=c.heads; details=c.details||{}; dueList=c.dueList||[]; return true; } }catch(e){}
  return false;
}

function baseDate(h){ return h.birthA||h.birthB; }
function esc(s){ const d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }
function sortedHeads(){ return [...heads].sort((x,y)=>String(baseDate(y)).localeCompare(String(baseDate(x)))); }
function isSelected(k){ return !!sel && sel.selected.includes(k); }

// 처음 한 번만: 최근 출산한 배를 기본으로 체크. 그 뒤로는 내가 바꾸지 않는 한 건드리지 않는다.
function initSelIfNeeded(){
  if(sel||!heads.length) return;
  sel={
    selected:heads.filter(h=>{ const n=daysSince(baseDate(h)); return n!=null&&n<=150; }).map(h=>h.key),
    known:heads.map(h=>h.key)
  };
  saveSel();
}

// ───────── 렌더링 ─────────
function dueCard(b){
  const n=-daysSince(b.dueDate);                 // 남은 날 (양수=앞으로, 0=오늘, 음수=지남)
  const late=n<0;
  const big = n>0 ? 'D-'+n : (n===0 ? 'D-Day' : 'D+'+(-n));
  const sub = n>0 ? weekText(n)+' 남음' : (n===0 ? '오늘이 예정일' : '예정일 '+(-n)+'일 지남');
  const title=(b.femaleName?b.femaleName+'네':'출산 예정');
  const parents=(b.femaleName||'모견 미지정')+' × '+(b.maleName||'부견 미지정');
  const range=(b.earliest&&b.latest)?`<div class="range">예상 구간 ${fmtShort(b.earliest)} ~ ${fmtShort(b.latest)}</div>`:'';
  return `<section class="litter due">
    <div class="l-title">🍼 ${esc(title)} 출산 예정</div>
    <div class="l-sub">${esc(parents)}</div>
    <div class="badges">
      <div class="badge d${late?' late':''}">
        <div class="lbl">${late?'출산 예정일 · 지연':'출산 예정일'}</div>
        <div class="dn">${big}</div>
        <div class="wk">${sub}</div>
        <div class="dt">${fmt(b.dueDate)}</div>
      </div>
    </div>${range}
  </section>`;
}

function render(){
  const nw=new Date();
  document.getElementById('today').textContent=nw.getFullYear()+'.'+String(nw.getMonth()+1).padStart(2,'0')+'.'+String(nw.getDate()).padStart(2,'0')+' 기준';
  const list=document.getElementById('list');
  const rows=sortedHeads().filter(h=>isSelected(h.key));
  if(!rows.length){
    list.innerHTML='<div class="empty">표시할 배가 선택되어 있지 않습니다.<br>위의 <b>⚙️ 배 선택</b>에서 체크해 주세요.</div>';
  } else {
    list.innerHTML=rows.map(h=>{
      const d=details[h.key];
      const title=(h.femaleName?h.femaleName+'네':'새끼들');
      if(!d){
        return `<section class="litter"><div class="l-title">🐾 ${esc(title)}</div><div class="l-sub">불러오는 중…</div></section>`;
      }
      const parents=(h.femaleName||'모견 미지정')+' × '+(d.maleName||'부견 미지정');
      const nA=daysSince(h.birthA), nB=daysSince(h.birthB);
      const badge=(cls,label,n,date)=>`
        <div class="badge ${cls}">
          <div class="lbl">${label}</div>
          <div class="dn">${dLabel(n)}</div>
          <div class="wk">${n!=null&&n>=0?weekText(n):''}</div>
          <div class="dt">${fmt(date)}</div>
        </div>`;
      const badges=(h.birthA?badge('a','출산 A',nA,h.birthA):'')+(h.birthB?badge('b','출산 B',nB,h.birthB):'');
      const nob=(h.birthA&&!h.birthB)?'<div class="nob">출산 B는 등록되어 있지 않습니다</div>':'';
      const pups=d.puppies.map(p=>{
        const cls=p.status==='분양 완료'?'sold':(p.status==='예약'?'rsv':'');
        const sx=p.sex==='male'?'<span class="m">♂</span>':(p.sex==='female'?'<span class="f">♀</span>':'');
        return `<span class="pup ${cls}">${sx}<span>${esc(p.name||'미지정')}</span><span class="st">${esc(p.status)}</span></span>`;
      }).join('');
      return `<section class="litter">
        <div class="l-title">🐾 ${esc(title)}</div>
        <div class="l-sub">${esc(parents)} · ${d.puppies.length}마리</div>
        <div class="badges">${badges}</div>${nob}
        ${pups?`<div class="pups">${pups}</div>`:''}
      </section>`;
    }).join('');
  }
  if(dueList.length){
    const dues=[...dueList].sort((x,y)=>String(x.dueDate).localeCompare(String(y.dueDate)));
    list.innerHTML='<div class="sec">🍼 출산 예정</div>'+dues.map(dueCard).join('')+(rows.length?'<div class="sec">🐾 태어난 새끼</div>':'')+list.innerHTML;
  }
  renderNotice();
  if(document.getElementById('panel').style.display==='block') renderPanel();
}

function renderNotice(){
  const el=document.getElementById('newNotice');
  const n=sel?heads.filter(h=>!sel.known.includes(h.key)).length:0;
  if(n>0 && document.getElementById('panel').style.display!=='block'){
    el.textContent='🆕 새로 등록된 배가 '+n+'개 있어요 (선택 안 됨) — 눌러서 확인';
    el.style.display='block';
  } else el.style.display='none';
}

function renderPanel(){
  const box=document.getElementById('opts');
  if(!heads.length){ box.innerHTML='<div class="empty" style="padding:16px">불러온 배가 없습니다.</div>'; return; }
  box.innerHTML=sortedHeads().map(h=>{
    const isNew=sel&&!sel.known.includes(h.key);
    const n=daysSince(baseDate(h));
    const t=(h.femaleName?h.femaleName+'네':'이름 없음');
    return `<label class="opt">
      <input type="checkbox" data-k="${esc(h.key)}" ${isSelected(h.key)?'checked':''}>
      <span><span class="t">${esc(t)}${isNew?'<em>NEW</em>':''}</span>
      <span class="s">출산 ${fmt(baseDate(h))}${n!=null&&n>=0?' · D+'+n:''}</span></span>
    </label>`;
  }).join('');
}

function togglePanel(force){
  const p=document.getElementById('panel');
  const open=(force===undefined)?(p.style.display!=='block'):force;
  p.style.display=open?'block':'none';
  if(open){ renderPanel(); document.getElementById('newNotice').style.display='none'; p.scrollIntoView({behavior:'smooth',block:'start'}); }
  else if(sel){
    // 패널을 닫으면 지금 보인 배는 "확인함"으로 처리 (선택 상태는 그대로)
    sel.known=heads.map(h=>h.key); saveSel(); renderNotice();
  }
}

document.getElementById('opts').addEventListener('change',async e=>{
  const cb=e.target.closest('input[data-k]'); if(!cb||!sel) return;
  const k=cb.getAttribute('data-k');
  const set=new Set(sel.selected);
  if(cb.checked) set.add(k); else set.delete(k);
  sel.selected=[...set];
  saveSel();
  render();
  if(cb.checked && !details[k]){
    const h=heads.find(x=>x.key===k);
    try{ details[k]=await fetchDetail(h); saveCache(); }
    catch(err){ setStatus('이 배의 정보를 불러오지 못했습니다. 🔄를 눌러주세요.',true); }
    render();
  }
});

function setStatus(msg,isErr){
  const s=document.getElementById('status');
  s.textContent=msg; s.className=isErr?'err':'';
}

async function load(manual){
  const btn=document.getElementById('refreshBtn');
  btn.disabled=true;
  setStatus(manual?'새로 불러오는 중…':'최신 정보 확인 중…');
  try{
    femaleMapPromise=null;
    heads=await fetchHeads();
    initSelIfNeeded();
    // 선택된 배만 상세를 불러온다 (선택 상태는 여기서 절대 바꾸지 않음)
    const targets=heads.filter(h=>isSelected(h.key));
    const duePromise=fetchDue(heads).catch(e=>{ console.warn('출산 예정 조회 실패',e); return null; });
    const fresh=await Promise.all(targets.map(async h=>[h.key,await fetchDetail(h)]));
    const nd={}; fresh.forEach(([k,v])=>{ nd[k]=v; });
    details=nd;
    const due=await duePromise;
    if(due) dueList=due;
    saveCache(); render();
    const n=new Date();
    setStatus('업데이트 '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+(due?'':' · 출산 예정은 불러오지 못했습니다'));
  }catch(e){
    console.warn(e);
    setStatus((heads.length||dueList.length)?'네트워크 오류 — 마지막으로 저장된 정보를 표시 중입니다':'불러오지 못했습니다. 연결을 확인하고 🔄를 눌러주세요.',true);
    render();
  }finally{ btn.disabled=false; }
}

// 날짜가 바뀐 뒤 앱으로 돌아오면 D+ 숫자를 다시 계산
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) render(); });

// 시작: 저장된 선택·정보를 먼저 보여주고 곧바로 최신 정보로 갱신
(function start(){
  sel=loadSel();
  const had=loadCache();
  render();
  if(had) setStatus('저장된 정보 표시 중 · 최신 정보 확인 중…');
  load(false);
})();
</script>
