<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5C3D1E">
<meta name="robots" content="noindex,nofollow">
<title>새끼 생후일수 · 골디쉼터</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235C3D1E'/%3E%3Ctext x='50' y='66' font-size='56' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3ED%2B%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#FAF7F2; --card:#fff; --br:#5C3D1E; --gold:#C8931A; --gray:#8B7E6F; --line:#E8E1D6;
  --a:#C8931A; --b:#2E7D6B;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1C1812; --card:#2A241B; --br:#F1E3CC; --gold:#E0AA3A; --gray:#B3A691; --line:#43392B; --a:#E0AA3A; --b:#4DB89F; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:var(--bg); color:var(--br);
  padding:env(safe-area-inset-top,0) 14px calc(24px + env(safe-area-inset-bottom,0)) 14px;
  max-width:560px; margin:0 auto;
}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 10px}
header h1{font-size:19px;font-weight:800}
header .today{font-size:12px;color:var(--gray);margin-top:3px}
#refreshBtn{
  border:1.5px solid var(--line);background:var(--card);color:var(--br);
  border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700;cursor:pointer
}
#refreshBtn:active{transform:scale(.97)}
#status{font-size:12px;color:var(--gray);padding:0 2px 10px;min-height:18px}
#status.err{color:#D14B3A;font-weight:700}
.litter{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.l-title{font-size:17px;font-weight:800}
.l-sub{font-size:12px;color:var(--gray);margin-top:3px}
.badges{display:flex;gap:10px;margin-top:14px}
.badge{flex:1;border-radius:14px;padding:12px 8px;text-align:center;border:2px solid var(--line)}
.badge.a{border-color:var(--a)}
.badge.b{border-color:var(--b)}
.badge .lbl{font-size:12px;font-weight:800;letter-spacing:.02em}
.badge.a .lbl{color:var(--a)}
.badge.b .lbl{color:var(--b)}
.badge .dn{font-size:34px;font-weight:900;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.badge .wk{font-size:12px;font-weight:700;margin-top:1px}
.badge .dt{font-size:11px;color:var(--gray);margin-top:3px}
.nob{font-size:11px;color:var(--gray);text-align:center;margin-top:8px}
.pups{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.pup{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:5px 10px;display:flex;gap:5px;align-items:center}
.pup .m{color:#3B82C4}.pup .f{color:#D9578F}
.pup .st{color:var(--gray);font-size:11px}
.pup.sold{opacity:.65}
.pup.rsv{border-color:var(--gold)}
.empty{text-align:center;color:var(--gray);padding:40px 10px;font-size:14px;line-height:1.7}
#moreBtn{
  display:none;width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--gray);
  border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;margin-top:2px
}
</style>
</head>
<body>

<header>
  <div>
    <h1>🐶 새끼 생후일수</h1>
    <div class="today" id="today"></div>
  </div>
  <button id="refreshBtn" onclick="load(true)">🔄 새로고침</button>
</header>
<div id="status">불러오는 중…</div>
<div id="list"></div>
<button id="moreBtn" onclick="showOlder()">지난 배 더 보기</button>

<script>
// ───────── 설정 ─────────
const DB = 'https://goldie-shelter-d6c81-default-rtdb.firebaseio.com';
const RECENT_DAYS = 150;          // 기본으로 보여줄 배: 출산 후 150일 이내
const CACHE_KEY = 'goldi_puppy_age_cache_v1';

// ───────── 날짜 계산 (D+0 = 출산일 당일, 구충·접종 일정 계산과 동일 기준) ─────────
function todayUTC(){ const n=new Date(); return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()); }
function dateUTC(str){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(str||''));
  return m ? Date.UTC(+m[1],+m[2]-1,+m[3]) : null;
}
function daysSince(str){ const d=dateUTC(str); return d==null?null:Math.round((todayUTC()-d)/86400000); }
function weekText(n){ if(n<0) return ''; const w=Math.floor(n/7), d=n%7; return w+'주 '+d+'일'; }
function fmt(str){ const d=dateUTC(str); if(d==null) return '—'; const x=new Date(d); return x.getUTCFullYear()+'.'+String(x.getUTCMonth()+1).padStart(2,'0')+'.'+String(x.getUTCDate()).padStart(2,'0'); }
function dLabel(n){ if(n==null) return '—'; if(n<0) return 'D'+n; return 'D+'+n; }

// ───────── 네트워크 ─────────
async function rest(path){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),15000);
  try{
    const q=path.indexOf('?');
    const url=DB+'/'+(q<0?path:path.slice(0,q))+'.json'+(q<0?'':path.slice(q));   // 쿼리스트링은 .json 뒤에 붙여야 한다
    const r=await fetch(url,{signal:ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function cleanName(code){
  const s=String(code==null?'':code).trim();
  if(!s) return '';
  return s.includes('/') ? s.split('/').pop().trim() : s;
}

let femaleMapPromise=null;      // 모견 목록은 한 번만 불러오고, 동시에 조회하는 배들이 같은 결과를 기다린다
function loadFemaleMap(){
  if(!femaleMapPromise){
    femaleMapPromise=(async()=>{
      const map={};
      const keys=await rest('females?shallow=true');
      await Promise.all(Object.keys(keys||{}).map(async k=>{
        try{
          const [cd,nm]=await Promise.all([rest('females/'+encodeURIComponent(k)+'/code'),rest('females/'+encodeURIComponent(k)+'/name')]);
          if(cd!=null && nm) map[String(cd).trim()]=cleanName(nm);
        }catch(e){}
      }));
      return map;
    })();
    femaleMapPromise.catch(()=>{ femaleMapPromise=null; });   // 실패하면 다음에 다시 시도
  }
  return femaleMapPromise;
}
async function femaleNameByCode(code){
  const c=String(code==null?'':code).trim();
  if(!c) return '';
  if(c.includes('/')) return cleanName(c);
  const map=await loadFemaleMap();
  return map[c]||c;
}

// 사진 등 무거운 필드를 피하려고 필요한 값만 하나씩 읽는다
async function fetchLitters(){
  const keys=Object.keys(await rest('litters?shallow=true')||{});
  const heads=await Promise.all(keys.map(async k=>{
    try{
      const [a,b]=await Promise.all([rest('litters/'+k+'/birthA'),rest('litters/'+k+'/birthB')]);
      return {key:k,birthA:a||'',birthB:b||''};
    }catch(e){ return null; }
  }));
  return heads.filter(h=>h && (h.birthA||h.birthB));
}
async function fetchLitterDetail(h){
  const [fc,mc,pids]=await Promise.all([
    rest('litters/'+h.key+'/femaleCode'),
    rest('litters/'+h.key+'/maleCode'),
    rest('litters/'+h.key+'/puppies?shallow=true')
  ]);
  const puppies=(await Promise.all(Object.keys(pids||{}).map(async pid=>{
    try{
      const base='litters/'+h.key+'/puppies/'+pid+'/';
      const [name,sex,status,promoted]=await Promise.all([rest(base+'name'),rest(base+'sex'),rest(base+'status'),rest(base+'promoted_to')]);
      return {id:pid,name:name||'',sex:sex||'',status:promoted?'승격됨':(status||'분양 전')};
    }catch(e){ return null; }
  }))).filter(Boolean).sort((x,y)=>String(x.name).localeCompare(String(y.name),'ko',{numeric:true}));
  let femaleName='', maleName='';
  try{ femaleName=await femaleNameByCode(fc); }catch(e){ femaleName=cleanName(fc); }
  maleName=cleanName(mc);
  return {...h,femaleName,maleName,puppies};
}

// ───────── 렌더링 ─────────
let allLitters=[];       // 상세까지 불러온 배
let olderHeads=[];       // 아직 상세를 안 불러온 지난 배
let showingOlder=false;

function baseDate(l){ return l.birthA||l.birthB; }
function esc(s){ const d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }

function render(){
  const nw=new Date();
  document.getElementById('today').textContent=nw.getFullYear()+'.'+String(nw.getMonth()+1).padStart(2,'0')+'.'+String(nw.getDate()).padStart(2,'0')+' 기준';
  const list=document.getElementById('list');
  const rows=[...allLitters].sort((x,y)=>String(baseDate(y)).localeCompare(String(baseDate(x))));
  if(!rows.length){
    list.innerHTML='<div class="empty">최근 '+RECENT_DAYS+'일 안에 출산한 배가 없습니다.<br>아래 버튼으로 지난 배를 볼 수 있어요.</div>';
  } else {
    list.innerHTML=rows.map(l=>{
      const title=(l.femaleName?l.femaleName+'네':'새끼들');
      const parents=(l.femaleName||'모견 미지정')+' × '+(l.maleName||'부견 미지정');
      const nA=daysSince(l.birthA), nB=daysSince(l.birthB);
      const badge=(cls,label,n,date)=>`
        <div class="badge ${cls}">
          <div class="lbl">${label}</div>
          <div class="dn">${dLabel(n)}</div>
          <div class="wk">${n!=null&&n>=0?weekText(n):''}</div>
          <div class="dt">${fmt(date)}</div>
        </div>`;
      const badges = (l.birthA?badge('a','출산 A',nA,l.birthA):'')+(l.birthB?badge('b','출산 B',nB,l.birthB):'');
      const nob = (l.birthA&&!l.birthB)?'<div class="nob">출산 B는 등록되어 있지 않습니다</div>':'';
      const pups=l.puppies.map(p=>{
        const cls=p.status==='분양 완료'?'sold':(p.status==='예약'?'rsv':'');
        const sx=p.sex==='male'?'<span class="m">♂</span>':(p.sex==='female'?'<span class="f">♀</span>':'');
        return `<span class="pup ${cls}">${sx}<span>${esc(p.name||'미지정')}</span><span class="st">${esc(p.status)}</span></span>`;
      }).join('');
      return `<section class="litter">
        <div class="l-title">🐾 ${esc(title)}</div>
        <div class="l-sub">${esc(parents)} · ${l.puppies.length}마리</div>
        <div class="badges">${badges}</div>${nob}
        ${pups?`<div class="pups">${pups}</div>`:''}
      </section>`;
    }).join('');
  }
  const more=document.getElementById('moreBtn');
  more.style.display=(olderHeads.length&&!showingOlder)?'block':'none';
}

function setStatus(msg,isErr){
  const s=document.getElementById('status');
  s.textContent=msg; s.className=isErr?'err':'';
}

function saveCache(){
  try{ localStorage.setItem(CACHE_KEY,JSON.stringify({t:Date.now(),allLitters,olderHeads})); }catch(e){}
}
function loadCache(){
  try{
    const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(c&&Array.isArray(c.allLitters)){ allLitters=c.allLitters; olderHeads=c.olderHeads||[]; return c.t; }
  }catch(e){}
  return null;
}

async function load(manual){
  const btn=document.getElementById('refreshBtn');
  btn.disabled=true;
  setStatus(manual?'새로 불러오는 중…':'최신 정보 확인 중…');
  try{
    femaleMapPromise=null; showingOlder=false;
    const heads=await fetchLitters();
    const recent=[], older=[];
    heads.forEach(h=>{
      const n=daysSince(baseDate(h));
      (n!=null && n<=RECENT_DAYS ? recent : older).push(h);
    });
    allLitters=await Promise.all(recent.map(fetchLitterDetail));
    olderHeads=older.sort((x,y)=>String(baseDate(y)).localeCompare(String(baseDate(x))));
    saveCache(); render();
    const n=new Date();
    setStatus('업데이트 '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'));
  }catch(e){
    console.warn(e);
    setStatus(allLitters.length?'네트워크 오류 — 마지막으로 저장된 정보를 표시 중입니다':'불러오지 못했습니다. 연결을 확인하고 새로고침을 눌러주세요.',true);
    render();
  }finally{ btn.disabled=false; }
}

async function showOlder(){
  const btn=document.getElementById('moreBtn');
  btn.disabled=true; btn.textContent='불러오는 중…';
  try{
    const details=await Promise.all(olderHeads.map(fetchLitterDetail));
    allLitters=allLitters.concat(details); olderHeads=[]; showingOlder=true;
    saveCache(); render();
  }catch(e){ setStatus('지난 배를 불러오지 못했습니다.',true); }
  finally{ btn.disabled=false; btn.textContent='지난 배 더 보기'; }
}

// 날짜가 바뀐 뒤 앱으로 돌아오면 D+ 숫자를 다시 계산
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) render(); });

// 시작: 저장된 정보를 먼저 보여주고 곧바로 최신 정보로 갱신
(function start(){
  const t=loadCache();
  render();
  if(t) setStatus('저장된 정보 표시 중 · 최신 정보 확인 중…');
  load(false);
})();
</script>
</body>
</html>
