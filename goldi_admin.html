<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>골디쉼터 관리자</title>
<style>
:root {
  --gold:#C8931A;--gold-l:#F0BE5A;--gold-p:#FDF5E0;
  --br:#5C3D1E;--br-l:#8B6240;--br-ll:#B8916A;
  --cream:#FAFAF7;--white:#fff;
  --gray:#6B6B6B;--gray-l:#E8E6E0;--gray-ll:#F4F3EF;
  --green:#27AE60;--red:#C0392B;--blue:#1E6FBB;
  --r:10px;--sh:0 2px 14px rgba(92,61,30,.10);
}
html, body { width:100%; max-width:100vw; overflow-x:hidden; margin:0; padding:0; }
*{box-sizing:border-box;margin:0;padding:0;word-break:break-word;overflow-wrap:anywhere}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--cream);color:var(--br);min-height:100vh}
header{background:var(--br);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.25);width:100%}
.logo{font-size:20px;color:var(--gold-l);font-weight:800;letter-spacing:-.5px}
.logo span{color:rgba(255,255,255,.45);font-size:12px;font-weight:400;margin-left:6px}
.tab-bar{display:flex;background:var(--br);padding:0 12px;border-bottom:2px solid var(--gold);overflow-x:auto;width:100%}
.tab-btn{padding:12px 18px;font-size:13px;font-weight:700;color:rgba(255,255,255,.5);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:.2s;white-space:nowrap;flex-shrink:0}
.tab-btn.active{color:var(--gold-l);border-bottom-color:var(--gold-l)}
.tab-btn:hover:not(.active){color:rgba(255,255,255,.8)}
.tab-panel{display:none;padding:16px 12px;max-width:960px;width:100%;margin:0 auto;box-sizing:border-box}
.tab-panel.active{display:block}
.stitle{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;padding-bottom:5px;border-bottom:1.5px solid var(--gold-l)}
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--gray-l);padding:16px;margin-bottom:16px;width:100%;box-sizing:border-box;overflow:hidden}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ffield{display:flex;flex-direction:column;gap:4px}
.ffield label{font-size:12px;font-weight:700;color:var(--br-l)}
.ffield input,.ffield select{border:1.5px solid var(--gray-l);border-radius:7px;padding:9px 12px;font-size:14px;font-family:inherit;color:var(--br);background:#fff;outline:none;width:100%;transition:border-color .15s}
.ffield input:focus,.ffield select:focus{border-color:var(--gold)}
.puppy-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.puppy-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--gray-l);border-radius:8px;cursor:pointer;transition:.15s;background:#fff}
.puppy-item:hover{border-color:var(--gold);background:var(--gold-p)}
.puppy-item.selected{border-color:var(--gold);background:var(--gold-p);box-shadow:0 0 0 2px var(--gold-l)}
.puppy-item.disabled{opacity:.5;cursor:not-allowed}
.puppy-name{font-weight:700;font-size:14px;flex:1}
.puppy-meta{font-size:12px;color:var(--gray)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-avail{background:#E8F8EF;color:var(--green);border:1px solid #A8DDB9}
.badge-rsv{background:#FFF3E0;color:#E67E22;border:1px solid #F5CBA7}
.badge-sold{background:#F0F0F0;color:#888;border:1px solid #CCC}
.gender-m{color:var(--blue);font-weight:700}
.gender-f{color:#BB1E6F;font-weight:700}
.litter-group{margin-bottom:20px}
.litter-label{font-size:12px;font-weight:800;color:var(--br-l);padding:6px 12px;background:var(--gray-ll);border-radius:6px;margin-bottom:8px;display:flex;gap:10px;align-items:center}
.link-box{background:var(--gray-ll);border:1.5px solid var(--gray-l);border-radius:8px;padding:12px 14px;font-size:12px;word-break:break-all;color:var(--gray);margin-bottom:10px}
.link-box strong{display:block;font-size:11px;color:var(--br-l);margin-bottom:4px}
#qrWrap{text-align:center;padding:16px;background:var(--gray-ll);border-radius:8px;margin-bottom:10px;display:none}
.btn{padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:var(--br)}
.btn-br{background:var(--br);color:#fff}
.btn-br:hover{background:#3a250f}
.btn-gray{background:var(--gray-l);color:var(--br)}
.btn-gray:hover{background:#d8d5ce}
.btn-green{background:var(--green);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.status-sel{display:flex;gap:6px;flex-wrap:wrap}
.status-opt{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid var(--gray-l);background:#fff;transition:.15s}
.so-avail{background:#E8F8EF;border-color:var(--green);color:var(--green)}
.so-rsv{background:#FFF3E0;border-color:#E67E22;color:#E67E22}
.so-sold{background:#F0F0F0;border-color:#888;color:#888}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--br);color:var(--gold-l);padding:9px 12px;text-align:left;font-weight:700}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--gray-l)}
.tbl tr:hover td{background:var(--gold-p)}
.tbl tr:last-child td{border-bottom:none}
.search-row{display:flex;gap:8px;margin-bottom:14px}
.search-row input{flex:1;border:1.5px solid var(--gray-l);border-radius:8px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none}
.search-row input:focus{border-color:var(--gold)}
.stats-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:#fff;border:1px solid var(--gray-l);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--sh)}
.stat-n{font-size:26px;font-weight:800;color:var(--gold);line-height:1}
.stat-l{font-size:11px;color:var(--gray);margin-top:3px;font-weight:600}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;justify-content:center;align-items:center;padding:16px}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.modal-head{background:var(--br);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-radius:12px 12px 0 0}
.modal-head h3{color:var(--gold-l);font-size:15px}
.modal-close{background:none;border:none;color:rgba(255,255,255,.6);font-size:20px;cursor:pointer}
.modal-body{padding:20px}
.detail-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--gray-l);font-size:13px}
.detail-row:last-child{border:none}
.detail-key{color:var(--gray);font-weight:600}
.detail-val{color:var(--br);font-weight:700;text-align:right;max-width:60%}
.loading{text-align:center;padding:40px;color:var(--gray);font-size:14px}
.spinner{width:32px;height:32px;border:3px solid var(--gray-l);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--br);color:#fff;padding:12px 22px;border-radius:8px;font-size:14px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.25);transition:transform .3s;z-index:999;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.info-chips{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;background:var(--gold-p);border-radius:8px;font-size:12px;margin-bottom:14px}
.chip{display:flex;gap:5px}
.chip-k{color:var(--gray);font-weight:600}
.chip-v{color:var(--br);font-weight:700}
.edit-puppy{padding:10px 12px;background:var(--gray-ll);border-radius:8px;margin-bottom:8px;border:1px solid var(--gray-l)}
.edit-puppy .fgrid{align-items:end}
.ep-label{font-size:11px;font-weight:800;color:var(--gold);margin-bottom:4px}
.litter-label .btn{margin-left:auto;flex-shrink:0}

/* Monthly Calendar Grid View Styles */
.cal-nav { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:10px; flex-wrap:wrap; background:#fff; padding:14px 18px; border-radius:var(--r); border:1px solid var(--gray-l); box-shadow:var(--sh); }
.cal-nav-center { display:flex; align-items:center; gap:12px; }
.cal-nav-center h2 { font-size:18px; font-weight:800; color:var(--br); white-space:nowrap; }
.cal-arrow { width:34px; height:34px; border-radius:50%; border:1.5px solid var(--gray-l); background:#fff; cursor:pointer; font-size:16px; display:inline-flex; align-items:center; justify-content:center; transition:.15s; font-weight:700; color:var(--br); }
.cal-arrow:hover { border-color:var(--gold); background:var(--gold-p); color:var(--gold); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:18px; background:var(--white); padding:16px; border-radius:var(--r); border:1px solid var(--gray-l); box-shadow:var(--sh); }
.cal-head { text-align:center; font-size:12px; font-weight:800; padding:8px 0; color:var(--gray); background:var(--gray-ll); border-radius:6px; margin-bottom:4px; }
.cal-head.sun { color:var(--red); }
.cal-head.sat { color:var(--blue); }
.cal-cell { min-height:72px; padding:6px; border-radius:8px; cursor:pointer; text-align:center; transition:.15s; border:1.5px solid var(--gray-l); position:relative; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
.cal-cell:hover { background:var(--gold-p); border-color:var(--gold-l); transform:translateY(-1px); }
.cal-cell.today { border-color:var(--gold); box-shadow:0 0 0 2px var(--gold-l); background:#FFFDF7; }
.cal-cell.selected { background:var(--gold-p); border-color:var(--gold); font-weight:700; }
.cal-cell.other { opacity:.35; cursor:default; background:var(--gray-ll); border-color:transparent; }
.cal-cell.other:hover { background:var(--gray-ll); border-color:transparent; transform:none; }
.cal-day { font-size:13px; font-weight:800; line-height:1; margin-bottom:4px; }
.cal-cell.sun .cal-day { color:var(--red); }
.cal-cell.sat .cal-day { color:var(--blue); }
.cal-chips { display:flex; flex-direction:column; gap:3px; width:100%; margin-top:2px; }
.cal-chip { font-size:10px; font-weight:800; padding:2px 4px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; text-align:center; }
.cal-chip.rsv { background:#FFF3E0; color:#E67E22; border:1px solid #F5CBA7; }
.cal-chip.delivery { background:#EBF5FB; color:#2980B9; border:1px solid #AED6F1; }
.cal-chip.care { background:#E8F8EF; color:#27AE60; border:1px solid #A8DDB9; }
@media(max-width:560px){.fgrid{grid-template-columns:1fr}.tab-btn{padding:10px 14px;font-size:12px}.cal-cell{min-height:50px;padding:3px}.cal-day{font-size:11px}.cal-chip{font-size:8px;padding:1px 2px}}
</style>
</head>

<!-- 🔒 로그인 게이트 -->
<div id="authGate" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#5C3D1E 0%,#3a250f 100%);display:flex;justify-content:center;align-items:center;padding:20px;">
  <div style="background:#fff;border-radius:16px;padding:40px 32px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center;">
    <div style="font-size:40px;margin-bottom:12px;">🐾</div>
    <h2 style="color:#5C3D1E;font-size:20px;margin-bottom:6px;">골디쉼터 관리자</h2>
    <p style="color:#8B6240;font-size:13px;margin-bottom:24px;">관리자 비밀번호를 입력해주세요</p>
    <input type="password" id="authPw" placeholder="비밀번호 입력" inputmode="numeric" maxlength="10"
      style="width:100%;padding:14px 16px;border:2px solid #E8E6E0;border-radius:10px;font-size:18px;text-align:center;letter-spacing:8px;font-weight:700;outline:none;transition:border-color .2s;box-sizing:border-box;"
      onfocus="this.style.borderColor='#C8931A'" onblur="this.style.borderColor='#E8E6E0'"
      onkeydown="if(event.key==='Enter')doLogin()">
    <div id="authErr" style="color:#C0392B;font-size:12px;margin-top:8px;min-height:18px;font-weight:700;"></div>
    <button onclick="doLogin()" style="width:100%;padding:14px;background:#C8931A;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:12px;transition:background .15s;"
      onmouseover="this.style.background='#5C3D1E'" onmouseout="this.style.background='#C8931A'">로그인</button>
  </div>
</div>
<script>
function doLogin(){
  var btn = document.querySelector('#authGate button');
  if (btn) { btn.disabled = true; btn.textContent = '확인 중...'; }
  setTimeout(function(){
    if (typeof window.doLogin === 'function' && window.doLogin !== doLogin) {
      window.doLogin();
    } else if (btn) { btn.disabled = false; btn.textContent = '로그인'; }
  }, 300);
}
window.doLogin = doLogin;
window.addEventListener('DOMContentLoaded', function(){
  var pw = document.getElementById('authPw');
  if (pw) pw.focus();
});
</script>

// ── 유틸
const fmt = d => d ? d.replace(/-/g,'.') : '—';
const numFmt = n => Number(n).toLocaleString('ko-KR')+'원';
function genderTxt(s){
  const v=String(s||'').toLowerCase();
  if(v==='female'||v==='암'||v==='f') return '암컷';
  if(v==='male'  ||v==='수'||v==='m') return '수컷';
  return s||'—';
}
function genderKo(s){
  const v=String(s||'').toLowerCase();
  if(v==='female'||v==='암'||v==='f') return '<span class="gender-f">♀ 암컷</span>';
  if(v==='male'  ||v==='수'||v==='m') return '<span class="gender-m">♂ 수컷</span>';
  return s||'—';
}
function statusBadge(st){
  if(!st||st==='분양 전') return '<span class="badge badge-avail">분양 전</span>';
  if(st==='예약')         return '<span class="badge badge-rsv">예약</span>';
  return                         '<span class="badge badge-sold">분양 완료</span>';
}
function toast(msg){

// 클립보드 복사 (모바일/보안 컨텍스트 대응)
async function safeCopy(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    // fallback: textarea 이용
    const ta=document.createElement('textarea');
    ta.value=text;ta.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');document.body.removeChild(ta);return true;}catch(e2){}
    document.body.removeChild(ta);
    // 최후 수단: prompt 창
    prompt('아래 링크를 길게 눌러 복사해주세요:',text);
    return false;
  }
}

  const today = new Date().toISOString().slice(0, 10);
  if (c.balance_date && c.balance_date < today) return { label: '🔴 잔금 연체', color: '#E74C3C' };

window.renderContractAnalytics = () => {
  const el = document.getElementById('dbAnalytics');
  if (!el) return;
  const all = Object.entries(window._contracts || {});
  const ym = new Date().toISOString().slice(0, 7);
  const monthList = all.filter(([, c]) => (c.contract_date || '').startsWith(ym));
  const monthCount = monthList.length;
  const monthRevenue = monthList.reduce((s, [, c]) => s + (Number(c.price) || 0), 0);

  const unpaid = all.filter(([, c]) => !c.balance_paid);
  const unpaidTotal = unpaid.reduce((s, [, c]) => s + Math.max((Number(c.price) || 0) - (Number(c.deposit) || 0), 0), 0);
  const paidCount = all.length - unpaid.length;
  const completionRate = all.length ? Math.round((paidCount / all.length) * 100) : 0;
  const todayStr = new Date().toISOString().slice(0, 10);

  const cardsHtml = `
    <div class="fgrid" style="grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px;">
      <div class="card" style="text-align:center; padding:12px;"><div style="font-size:11px; color:var(--gray); font-weight:700;">이번달 계약건수</div><div style="font-size:20px; font-weight:800; color:var(--br);">${monthCount}건</div></div>
      <div class="card" style="text-align:center; padding:12px;"><div style="font-size:11px; color:var(--gray); font-weight:700;">이번달 매출</div><div style="font-size:20px; font-weight:800; color:var(--br);">${numFmt(monthRevenue)}</div></div>
      <div class="card" style="text-align:center; padding:12px;"><div style="font-size:11px; color:var(--gray); font-weight:700;">잔금 미수금</div><div style="font-size:20px; font-weight:800; color:#E74C3C;">${numFmt(unpaidTotal)}</div></div>
      <div class="card" style="text-align:center; padding:12px;"><div style="font-size:11px; color:var(--gray); font-weight:700;">완납률</div><div style="font-size:20px; font-weight:800; color:#27AE60;">${completionRate}%</div></div>
    </div>
  `;

  let unpaidHtml = '';
  if (unpaid.length) {
    const rows = unpaid
      .sort(([, a], [, b]) => (a.balance_date || '9999').localeCompare(b.balance_date || '9999'))
      .map(([id, c]) => {
        const overdue = c.balance_date && c.balance_date < todayStr;
        const bal = Math.max((Number(c.price) || 0) - (Number(c.deposit) || 0), 0);
        return `<tr style="cursor:pointer; ${overdue ? 'background:#FDEDEC;' : ''}" onclick="showDetail('${id}')">
          <td>${c.buyer_name || '—'}</td>
          <td>${c.buyer_phone || '—'}</td>
          <td>${numFmt(bal)}</td>
          <td>${fmt(c.balance_date)}${overdue ? ' <span style="color:#E74C3C; font-weight:800;">연체</span>' : ''}</td>
        </tr>`;
      }).join('');
    unpaidHtml = `
      <div class="stitle">💰 잔금 미납자 리스트 (${unpaid.length}건)</div>
      <div class="card" style="padding:0; overflow:hidden; margin-bottom:14px;">
        <table class="tbl"><thead><tr><th>구매자</th><th>연락처</th><th>미납액</th><th>잔금예정일</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    `;
  }

  el.innerHTML = cardsHtml + unpaidHtml;
};

  window._dbCalDate.setMonth(window._dbCalDate.getMonth() + offset);

window.renderDbCalendar = () => {
  const grid = document.getElementById('dbCalGrid');
  const titleEl = document.getElementById('dbCalTitle');
  if (!grid || !titleEl) return;

  const year = window._dbCalDate.getFullYear();
  const month = window._dbCalDate.getMonth();
  titleEl.textContent = `${year}년 ${month + 1}월`;

  const events = Object.entries(window._contracts || {})
    .filter(([, c]) => c.balance_date && !c.balance_paid)
    .map(([id, c]) => ({ id, date: c.balance_date, buyer: c.buyer_name || '고객' }));

  const daysKo = ['일', '월', '화', '수', '목', '금', '토'];
  let html = daysKo.map((d, i) => `<div class="cal-head${i === 0 ? ' sun' : ''}${i === 6 ? ' sat' : ''}">${d}</div>`).join('');

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDayOfWeek = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const prevLastDay = new Date(year, month, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);

  for (let i = startDayOfWeek - 1; i >= 0; i--) {
    html += `<div class="cal-cell other"><div class="cal-day">${prevLastDay - i}</div></div>`;
  }
  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dayEvents = events.filter(e => e.date === dateStr);
    const isToday = dateStr === todayStr;
    const overdue = dateStr < todayStr && dayEvents.length;
    let chipsHtml = '';
    if (dayEvents.length) {
      chipsHtml = `<div class="cal-chips"><div class="cal-chip delivery" style="${overdue ? 'background:#FDEDEC; color:#E74C3C; border-color:#F5B7B1;' : ''}">💰 ${dayEvents.length}건</div></div>`;
    }
    html += `<div class="cal-cell${isToday ? ' today' : ''}"><div class="cal-day">${d}</div>${chipsHtml}</div>`;
  }
  const totalCells = startDayOfWeek + totalDays;
  const remainingCells = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remainingCells; i++) {
    html += `<div class="cal-cell other"><div class="cal-day">${i}</div></div>`;
  }
  grid.innerHTML = html;
};

// Google Calendar 1-Click URL Generator
window.buildGCalUrl = function(title, details, location, startDateStr) {
  const t = encodeURIComponent(title || '[골디쉼터 일정]');
  const d = encodeURIComponent(details || '');
  const l = encodeURIComponent(location || '');
  let datesParam = '';
  let ctzParam = '';
  if (startDateStr) {
    const clean = startDateStr.replace(/[^0-9]/g, '');
    if (clean.length === 8) {
      datesParam = `&dates=${clean}/${clean}`;
    } else if (clean.length >= 12) {
      const ymd = clean.slice(0, 8);
      const hm = clean.slice(8, 12);
      // Z(UTC)를 붙이지 않고 한국시간(Asia/Seoul) 로컬시각 + ctz 파라미터로 정확히 등록
      datesParam = `&dates=${ymd}T${hm}00/${ymd}T${hm}00`;
      ctzParam = `&ctz=Asia%2FSeoul`;
    }
  }
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${t}&details=${d}&location=${l}${datesParam}${ctzParam}`;
};

// Batch Export / Auto-Sync Active Month's [Reservation & Delivery] Events to Google Calendar
window.exportMonthGCalICS = function() {
  const year = window._currentCalDate.getFullYear();
  const month = window._currentCalDate.getMonth();

  // Filter ONLY 'rsv' and 'delivery' events for active month (strictly exclude disinfection/care)
  const syncEvents = (window._mergedEvents || []).filter(e => {
    if (!e.date) return false;
    const type = e.type || 'rsv';
    if (type !== 'rsv' && type !== 'delivery') return false; // Exclude care/disinfection
    const parts = e.date.split('-');
    if (parts.length < 2) return false;
    const ey = parseInt(parts[0], 10);
    const em = parseInt(parts[1], 10) - 1;
    return ey === year && em === month;
  });

  if (!syncEvents.length) {
    alert(`${year}년 ${month + 1}월에 등록된 [예약 & 배송] 일정이 없습니다.`);
    return;
  }

  let icsLines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Goldie Shelter//Calendar Sync Engine//KO',
    'X-WR-CALNAME:골디쉼터 예약 및 배송 일정',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH'
  ];

  syncEvents.forEach(e => {
    const cleanDate = e.date.replace(/[^0-9]/g, '');
    const summary = (e.title || '골디쉼터 일정').replace(/\n/g, ' ');
    let desc = (e.details || '').replace(/\n/g, ' ');
    if (e.tmapUrl) desc += ` | Tmap: ${e.tmapUrl}`;
    const loc = (e.location || '골디쉼터').replace(/\n/g, ' ');

    // 시간이 있으면 특정 시각 일정으로, 없으면 종일 일정으로 등록
    let dtLines;
    if (e.time) {
      const cleanTime = e.time.replace(/[^0-9]/g, '').padEnd(4, '0'); // HHmm
      const startLocal = `${cleanDate}T${cleanTime}00`;
      // 한국 표준시(KST, UTC+9) 기준 로컬 시각으로 등록
      dtLines = [
        `DTSTART;TZID=Asia/Seoul:${startLocal}`,
        `DTEND;TZID=Asia/Seoul:${startLocal}`
      ];
    } else {
      dtLines = [
        `DTSTART;VALUE=DATE:${cleanDate}`,
        `DTEND;VALUE=DATE:${cleanDate}`
      ];
    }

    icsLines.push(
      'BEGIN:VEVENT',
      `UID:${e.id}@goldie.com`,
      `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`,
      ...dtLines,
      `SUMMARY:${summary}`,
      `DESCRIPTION:${desc}`,
      `LOCATION:${loc}`,
      'STATUS:CONFIRMED',
      'END:VEVENT'
    );
  });

  icsLines.push('END:VCALENDAR');

  const blob = new Blob([icsLines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Goldie_Reservations_Deliveries_${year}_${month + 1}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  showToast(`📅 ${year}년 ${month + 1}월 예약&배송 ${syncEvents.length}건 캘린더(.ics) 일괄 동기화 완료!`);

  // Prompt Google Calendar import settings page
  setTimeout(() => {
    if (confirm(`📅 ${syncEvents.length}건의 [예약 & 배송] 일정이 담긴 구글 캘린더 동기화 파일이 생성되었습니다!\n\n구글 캘린더 웹사이트 가져오기(Import) 화면으로 바로 이동하시겠습니까?`)) {
      window.open('https://calendar.google.com/calendar/u/0/r/settings/export', '_blank');
    }
  }, 300);
};

window.renderCalendarEvents = function() {
  // Aggregate All Realtime DB Data Sources
  const mergedEvents = [];
  const deliveryContractsSet = new Set();
  const deliveryCustomerDateSet = new Set();

  // 1. Existing Deliveries (/deliveries) - Priority 1
  Object.entries(window._deliveries).forEach(([id, d]) => {
    if (!d || !d.date) return;
    const tmapUrl = d.address ? `https://daveheo89.github.io/Goldie/tmap.html?q=${encodeURIComponent(d.address)}` : '';
    
    if (d.contractId) deliveryContractsSet.add(d.contractId);
    if (d.buyer_name) deliveryCustomerDateSet.add(`${d.date}_${d.buyer_name}`);
    if (d.buyer_phone) deliveryCustomerDateSet.add(`${d.date}_${d.buyer_phone}`);

    mergedEvents.push({
      id: `delivery-${id}`,
      dbKey: id,
      dbPath: `deliveries/${id}`,
      type: 'delivery',
      title: `🚚 [배송] ${d.buyer_name || '수령인'} 님 (${d.buyer_phone || ''})`,
      date: d.date,
      time: d.time || '',
      location: d.address || '',
      details: `수령인: ${d.buyer_name || ''} (${d.buyer_phone || ''}) | 계약ID: ${d.contractId || ''}`,
      tmapUrl: tmapUrl,
      raw: d
    });
  });

  // 2. Existing Reservations (/reservations) - Skip if overlap with Delivery
  Object.entries(window._reservations).forEach(([id, r]) => {
    if (!r || !r.date) return;
    const name = r.buyer_name || r.name || r.visitorName || '';
    const phone = r.phone || r.buyer_phone || r.visitorPhone || '';

    // Check deduplication
    if (name && deliveryCustomerDateSet.has(`${r.date}_${name}`)) return;
    if (phone && deliveryCustomerDateSet.has(`${r.date}_${phone}`)) return;

    mergedEvents.push({
      id: `rsv-${id}`,
      dbKey: id,
      dbPath: `reservations/${id}`,
      type: 'rsv',
      title: `🤝 [방문 예약] ${name || '방문 고객'} ${phone ? `(${phone})` : ''}`,
      date: r.date,
      time: r.timeStart || r.time || '',
      location: r.location || '골디쉼터 본원',
      details: `메모: ${r.memo || '없음'} | Status: ${r.status || '신청'}`,
      raw: r
    });
  });

  // 3. Existing Contracts Balance Dates (/contracts) - Skip if overlap with Delivery
  Object.entries(window._contracts).forEach(([id, c]) => {
    if (!c || !c.balance_date) return;
    if (deliveryContractsSet.has(id)) return; // Skip if delivery exists for contractId
    if (c.buyer_name && deliveryCustomerDateSet.has(`${c.balance_date}_${c.buyer_name}`)) return;

    mergedEvents.push({
      id: `contract-bal-${id}`,
      dbKey: id,
      dbPath: `contracts/${id}`,
      type: 'rsv',
      title: `💰 [잔금 납부일] ${c.buyer_name || ''} 님 (${c.dogname || ''})`,
      date: c.balance_date,
      location: c.buyer_addr || '',
      details: `분양가: ${c.price ? numFmt(c.price) : ''} | 연락처: ${c.buyer_phone || ''}`,
      raw: c
    });
  });


  // 5. Custom Schedules (/schedules)
  Object.entries(window._schedules).forEach(([id, s]) => {
    if (!s || !s.date) return;
    mergedEvents.push({
      id: `schedule-${id}`,
      dbKey: id,
      dbPath: `schedules/${id}`,
      type: s.type || 'rsv',
      title: s.title,
      date: s.date,
      time: s.time || '',
      location: s.location || '골디쉼터',
      details: s.details || '',
      raw: s
    });
  });

  window._mergedEvents = mergedEvents;
  renderMonthlyGridCalendar();
};

window.renderMonthlyGridCalendar = function() {
  const year = window._currentCalDate.getFullYear();
  const month = window._currentCalDate.getMonth();
  
  const titleEl = document.getElementById('calTitle');
  if (titleEl) titleEl.textContent = `${year}년 ${month + 1}월`;

  const gridEl = document.getElementById('calGrid');
  if (!gridEl) return;

  const daysKo = ['일', '월', '화', '수', '목', '금', '토'];
  let html = daysKo.map((d, i) => `<div class="cal-head${i === 0 ? ' sun' : ''}${i === 6 ? ' sat' : ''}">${d}</div>`).join('');

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDayOfWeek = firstDay.getDay();
  const totalDays = lastDay.getDate();

  // Filter events by selected category
  const filter = window._calFilter;
  const filteredEvents = (window._mergedEvents || []).filter(e => {
    const type = e.type || 'rsv';
    if (filter === 'rsv') return type === 'rsv';
    if (filter === 'delivery') return type === 'delivery';
    return true;
  });

  // Previous month trailing days
  const prevLastDay = new Date(year, month, 0).getDate();
  for (let i = startDayOfWeek - 1; i >= 0; i--) {
    html += `<div class="cal-cell other"><div class="cal-day">${prevLastDay - i}</div></div>`;
  }

  const todayStr = new Date().toISOString().slice(0, 10);

  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dateObj = new Date(year, month, d);
    const dayOfWeek = dateObj.getDay();

    const isToday = dateStr === todayStr;
    const isSel = dateStr === window._selectedCalDateStr;

    // Events on this date
    const dayEvents = filteredEvents.filter(e => e.date === dateStr);

    let chipsHtml = '';
    if (dayEvents.length > 0) {
      chipsHtml = '<div class="cal-chips">';
      const rsvCount = dayEvents.filter(e => e.type === 'rsv').length;
      const delCount = dayEvents.filter(e => e.type === 'delivery').length;

      if (rsvCount > 0) chipsHtml += `<div class="cal-chip rsv">🟡 예약 ${rsvCount}</div>`;
      if (delCount > 0) chipsHtml += `<div class="cal-chip delivery">🔵 배송 ${delCount}</div>`;
      chipsHtml += '</div>';
    }

    html += `
      <div class="cal-cell${isToday ? ' today' : ''}${isSel ? ' selected' : ''}${dayOfWeek === 0 ? ' sun' : ''}${dayOfWeek === 6 ? ' sat' : ''}" onclick="selectCalDate('${dateStr}')">
        <div class="cal-day">${d}</div>
        ${chipsHtml}
      </div>
    `;
  }

  // Next month leading days
  const totalCells = startDayOfWeek + totalDays;
  const remainingCells = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remainingCells; i++) {
    html += `<div class="cal-cell other"><div class="cal-day">${i}</div></div>`;
  }

  gridEl.innerHTML = html;
  renderSelectedDayEvents(window._selectedCalDateStr);
};

window.selectCalDate = function(dateStr) {
  window._selectedCalDateStr = dateStr;
  renderMonthlyGridCalendar();
};

window.renderSelectedDayEvents = function(dateStr) {
  const container = document.getElementById('dayDetailsContainer');
  const titleEl = document.getElementById('selectedDayTitle');
  if (!container || !titleEl) return;

  titleEl.textContent = `📅 선택된 날짜: ${fmt(dateStr)} 일정 목록`;

  const filter = window._calFilter;
  const dayEvents = (window._mergedEvents || []).filter(e => {
    if (e.date !== dateStr) return false;
    const type = e.type || 'rsv';
    if (filter === 'rsv') return type === 'rsv';
    if (filter === 'delivery') return type === 'delivery';
    return true;
  });

  if (!dayEvents.length) {
    container.innerHTML = `
      <div class="card" style="text-align:center; padding:20px; color:var(--gray); font-size:13px;">
        ${fmt(dateStr)} 날짜에 등록된 일정이 없습니다. 달력에서 다른 날짜를 선택하거나 오른쪽 상단 '+ 일정 등록'을 누르세요.
      </div>
    `;
    return;
  }

  container.innerHTML = dayEvents.map(s => {
    const type = s.type || 'rsv';
    let catBadge = '';
    let isGCalSyncable = true;

    if (type === 'rsv') {
      catBadge = '<span class="badge" style="background:#FFF3E0; color:#E67E22; border:1px solid #F5CBA7;">🟡 예약</span>';
    } else if (type === 'delivery') {
      catBadge = '<span class="badge" style="background:#EBF5FB; color:#2980B9; border:1px solid #AED6F1;">🔵 배송</span>';
    } else {
      catBadge = '<span class="badge" style="background:#E8F8EF; color:#27AE60; border:1px solid #A8DDB9;">🟢 방역/치료 (독립)</span>';
      isGCalSyncable = false;
    }

    const gcalDateStr = s.time ? `${s.date}${s.time.replace(':', '')}` : s.date;
    const gcalUrl = window.buildGCalUrl(s.title, s.details || '', s.location || '', gcalDateStr);

    let gcalBtn = '';
    if (isGCalSyncable) {
      gcalBtn = `<a href="${gcalUrl}" target="_blank" class="btn btn-gold btn-sm" style="text-decoration:none;">📅 Google 캘린더에 추가</a>`;
    } else {
      gcalBtn = `<span style="font-size:11px; color:var(--gray);">🔒 방역/치료 독립 카테고리 (내부 전용)</span>`;
    }

    let tmapBtn = '';
    if (s.tmapUrl) {
      tmapBtn = `<a href="${s.tmapUrl}" target="_blank" class="btn btn-br btn-sm" style="text-decoration:none;">🚙 Tmap 길안내</a>`;
    }

    let kakaoBtn = '';
    if (type === 'delivery' || s.tmapUrl) {
      kakaoBtn = `<button class="btn btn-sm" onclick="shareDeliveryKakao('${s.id}')" style="background:#FEE500; color:#191919; font-weight:700; border:none; text-decoration:none; cursor:pointer;">💬 가족 카톡 전송</button>`;
    }

    // 배송 카드에 연결된 계약의 잔금 완납 상태 버튼
    let settleBtn = '';
    let settledBadge = '';
    if (type === 'delivery') {
      const contractId = s.raw?.contractId;
      const linkedContract = contractId ? (window._contracts || {})[contractId] : null;
      if (linkedContract) {
        if (linkedContract.balance_paid) {
          settledBadge = `<span class="badge" style="background:#E8F8EF; color:#27AE60; border:1px solid #A8DDB9; margin-left:6px;">✅ 잔금 완료</span>`;
        } else {
          settleBtn = `<button class="btn btn-sm" onclick="settleBalanceFromDelivery('${contractId}')" style="background:#27AE60; color:#fff; font-weight:700; border:none;">💰 잔금 수령 완료</button>`;
        }
      }
    }

    return `
      <div class="card" style="margin-bottom:10px; border-left: 5px solid ${type==='rsv'?'#F59E0B':(type==='delivery'?'#3B82F6':'#10B981')}">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; flex-wrap:wrap; gap:6px;">
          <div>
            ${catBadge}${settledBadge}
            <span style="font-weight:800; font-size:15px; margin-left:8px;">${s.title}</span>
          </div>
          <span style="font-size:12px; color:var(--gray); font-weight:600;">📅 ${fmt(s.date)}${s.time ? ` ⏰ ${s.time}` : ''}</span>
        </div>
        ${s.location ? `<div style="font-size:12px; color:var(--br-l); margin-bottom:4px; word-break:break-all;">📍 <strong>장소/주소:</strong> ${s.location}</div>` : ''}
        ${s.details ? `<div style="font-size:12px; color:var(--gray); margin-bottom:10px; word-break:break-all;">📝 <strong>상세내용:</strong> ${s.details}</div>` : ''}
        <div class="btn-row" style="margin-top:10px; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            ${gcalBtn}
            ${tmapBtn}
            ${kakaoBtn}
            ${settleBtn}
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-gold btn-sm" onclick="openEditCalendarEventModal('${s.id}')">✏️ 수정</button>
            <button class="btn btn-gray btn-sm" onclick="deleteCalendarEvent('${s.dbPath}')" style="color:var(--red);">삭제</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
};

// 배송 카드에서 바로 잔금 완납 처리 (계약과 연결된 경우)
window.settleBalanceFromDelivery = async (contractId) => {
  if (!contractId) return;
  if (!confirm('이 계약의 잔금을 완납 처리하시겠습니까?')) return;
  await update(ref(db, `contracts/${contractId}`), {
    balance_paid: true,
    balance_paid_date: new Date().toISOString().slice(0, 10)
  });
  toast('💰 잔금 완납 처리되었습니다.');
};

// 💬 가족 공유용 배송 일정 카카오톡 메시지 전송 기능
window.shareDeliveryKakao = async function(eventId) {
  const event = (window._mergedEvents || []).find(e => e.id === eventId);
  if (!event) return;

  const raw = event.raw || {};
  const dogName = event.dogname || raw.dogname || raw.puppy || raw.puppyName || raw.dogName || '자견';
  const dateStr = event.date || '';
  const timeStr = event.time || raw.time || '';
  const dateTimeStr = timeStr ? `${dateStr} ${timeStr}` : dateStr;

  const buyerName = event.buyer_name || raw.buyer_name || raw.visitorName || raw.name || raw.buyerName || '수령인';
  const buyerPhone = event.buyer_phone || raw.buyer_phone || raw.visitorPhone || raw.phone || raw.buyerPhone || '';
  const buyerStr = buyerPhone ? `${buyerName} (${buyerPhone})` : buyerName;

  const addressStr = event.location || raw.address || raw.buyer_addr || raw.location || '주소 미지정';

  let tmapLink = event.tmapUrl;
  if (!tmapLink && addressStr && addressStr !== '주소 미지정') {
    tmapLink = `https://daveheo89.github.io/Goldie/tmap.html?q=${encodeURIComponent(addressStr)}`;
  }
  if (!tmapLink) {
    tmapLink = `https://daveheo89.github.io/Goldie/tmap.html?q=${encodeURIComponent('골디쉼터')}`;
  }

  const memoStr = raw.memo || raw.details || event.details || '특이사항 없음';

  const kakaoMsg = `[골디쉼터] 🚗 배송 일정 안내

🐾 강아지: ${dogName}
📅 배송 일시: ${dateTimeStr}
👤 수령인: ${buyerStr}
📍 배송 주소: ${addressStr}

🚙 티맵 길안내 (클릭 시 티맵 앱 실행):
${tmapLink}

📝 메모: ${memoStr}`;

  // 모바일 브라우저인 경우 카카오톡 공유창 직접 연결
  if (navigator.share) {
    try {
      await navigator.share({
        title: '[골디쉼터] 🚗 배송 일정 안내',
        text: kakaoMsg
      });
      toast('💬 가족 공유용 카카오톡 창이 열렸습니다.');
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }

  // 데스크톱 / PC인 경우 클립보드에 자동 복사 후 전송 안내
  const ok = await safeCopy(kakaoMsg);
  if (ok) {
    toast('💬 가족 전달용 배송 안내 메시지가 복사되었습니다! 카카오톡에 붙여넣어 전송하세요.');
  }
};

// ✏️ 예약 & 배송 일정 수정 모달
window.openEditCalendarEventModal = function(eventId) {
  const event = (window._mergedEvents || []).find(e => e.id === eventId);
  if (!event) return;

  const raw = event.raw || {};
  const type = event.type || 'rsv';
  const dogname = event.dogname || raw.dogname || raw.puppy || raw.puppyName || raw.dogName || '';
  const buyer_name = event.buyer_name || raw.buyer_name || raw.visitorName || raw.name || raw.buyerName || '';
  const buyer_phone = event.buyer_phone || raw.buyer_phone || raw.visitorPhone || raw.phone || raw.buyerPhone || '';
  const date = event.date || '';
  const time = event.time || raw.time || raw.timeStart || '';
  const location = event.location || raw.address || raw.buyer_addr || raw.location || '';
  const details = raw.memo || raw.details || event.details || '';

  const html = `
    <div class="ffield" style="margin-bottom:12px;">
      <label>카테고리</label>
      <select id="edit_cal_type" disabled style="padding:10px; font-weight:700; background:var(--gray-ll);">
        <option value="delivery" ${type==='delivery'?'selected':''}>🔵 자택 배송</option>
        <option value="rsv" ${type==='rsv'?'selected':''}>🟡 방문 예약</option>
      </select>
    </div>
    <div class="ffield" style="margin-bottom:12px;">
      <label>강아지 이름 (선택)</label>
      <input type="text" id="edit_dogname" value="${dogname}" placeholder="예: 빨강이">
    </div>
    <div class="ffield" style="margin-bottom:12px;">
      <label>수령인 / 방문자 성함 *</label>
      <input type="text" id="edit_buyer_name" value="${buyer_name}" placeholder="예: 양경모">
    </div>
    <div class="ffield" style="margin-bottom:12px;">
      <label>연락처 *</label>
      <input type="text" id="edit_buyer_phone" value="${buyer_phone}" placeholder="예: 01027592454">
    </div>
    <div class="fgrid" style="margin-bottom:12px;">
      <div class="ffield"><label>일자 *</label><input type="date" id="edit_date" value="${date}"></div>
      <div class="ffield"><label>시간 (선택)</label><input type="time" id="edit_time" value="${time}"></div>
    </div>
    <div class="ffield" style="margin-bottom:12px;">
      <label>배송 주소 / 방문 장소 *</label>
      <input type="text" id="edit_location" value="${location}" placeholder="예: 서울 마포구 성미산로15길 52 1층">
    </div>
    <div class="ffield" style="margin-bottom:16px;">
      <label>상세 메모 (선택)</label>
      <textarea id="edit_details" style="border:1.5px solid var(--gray-l); border-radius:7px; padding:10px; font-family:inherit; height:70px;" placeholder="예: 골목 공사중이라 근처 와서 전화 요청">${details}</textarea>
    </div>
    <div class="btn-row" style="margin-top:16px; justify-content:flex-end;">
      <button class="btn btn-gray" onclick="closeModal()">취소</button>
      <button class="btn btn-gold" onclick="saveEditCalendarEvent('${eventId}')">💾 수정사항 저장</button>
    </div>
  `;

  document.getElementById('modalTitle').textContent = `✏️ 일정 수정 — ${type === 'delivery' ? '🔵 배송' : '🟡 예약'}`;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('detailModal').classList.add('open');
};

window.saveEditCalendarEvent = async function(eventId) {
  const event = (window._mergedEvents || []).find(e => e.id === eventId);
  if (!event) return;

  const dogname = (document.getElementById('edit_dogname')?.value || '').trim();
  const buyer_name = (document.getElementById('edit_buyer_name')?.value || '').trim();
  const buyer_phone = (document.getElementById('edit_buyer_phone')?.value || '').trim();
  const date = document.getElementById('edit_date')?.value;
  const time = document.getElementById('edit_time')?.value || '';
  const location = (document.getElementById('edit_location')?.value || '').trim();
  const details = (document.getElementById('edit_details')?.value || '').trim();

  if (!date) {
    toast('일자를 입력해주세요.');
    return;
  }

  try {
    const dbPath = event.dbPath;
    if (dbPath.startsWith('deliveries/')) {
      await update(ref(db, dbPath), {
        dogname: dogname,
        buyer_name: buyer_name,
        buyer_phone: buyer_phone,
        date: date,
        time: time,
        address: location,
        memo: details
      });
    } else if (dbPath.startsWith('reservations/')) {
      await update(ref(db, dbPath), {
        visitorName: buyer_name,
        visitorPhone: buyer_phone,
        date: date,
        timeStart: time,
        memo: details
      });
    } else if (dbPath.startsWith('schedules/')) {
      const newTitle = event.type === 'delivery' ? `🚚 [배송] ${buyer_name || '수령인'} 님` : `🟡 [예약] ${buyer_name || '방문자'} 님`;
      await update(ref(db, dbPath), {
        title: newTitle,
        date: date,
        time: time,
        location: location,
        details: details
      });
    } else if (dbPath.startsWith('contracts/')) {
      await update(ref(db, dbPath), {
        balance_date: date,
        memo: details
      });
    }

    closeModal();
    toast('✏️ 일정 정보가 성공적으로 수정되었습니다.');
  } catch (e) {
    alert('수정 실패: ' + e.message);
  }
};





window.openAddEventModal = function() {
  const html = `
    <div class="ffield" style="margin-bottom:12px;">
      <label>카테고리 구분 *</label>
      <select id="cal_type" onchange="window.onCalTypeChange()" style="padding:10px; font-weight:700;">
        <option value="rsv">🟡 예약 (방문/상담 - Google 캘린더 연동)</option>
        <option value="delivery">🔵 배송 (분양 인도 - Google 캘린더 연동)</option>
      </select>
    </div>
    <div class="ffield" id="cal_contract_field" style="margin-bottom:12px; display:none;">
      <label>분양 계약건 선택 (선택 시 아래 정보 자동 입력)</label>
      <select id="cal_contract" onchange="window.onCalContractSelect()" style="padding:10px;">
        <option value="">-- 계약 선택 (직접 입력하려면 비워두세요) --</option>
      </select>
    </div>
    <div class="ffield" style="margin-bottom:12px;">
      <label>일정 제목 *</label>
      <input type="text" id="cal_title" placeholder="예: 홍길동 님 자견 인도 배송 / 견사 전체 소독">
    </div>
    <div class="fgrid" style="margin-bottom:12px;">
      <div class="ffield"><label>날짜 *</label><input type="date" id="cal_date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="ffield"><label>시간 (선택)</label><input type="time" id="cal_time"></div>
    </div>
    <div class="ffield" style="margin-bottom:12px;">
      <label>장소 / 배송지 주소 (선택)</label>
      <input type="text" id="cal_location" placeholder="예: 서울시 강남구 테헤란로 123">
    </div>
    <div class="ffield" style="margin-bottom:12px;">
      <label>상세 내용 / 메모 (선택)</label>
      <textarea id="cal_details" style="border:1.5px solid var(--gray-l); border-radius:7px; padding:10px; font-family:inherit; height:70px;" placeholder="연락처, 수령 강아지 이름, 전달사항 입력"></textarea>
    </div>
    <div class="btn-row" style="margin-top:16px;">
      <button class="btn btn-gray" onclick="closeModal()">취소</button>
      <button class="btn btn-gold" onclick="saveAddEvent()">💾 일정 저장</button>
    </div>
  `;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('detailModal').classList.add('open');
  window.onCalTypeChange();
};

// 카테고리를 '배송'으로 바꾸면 계약 선택 드롭다운을 보여주고 목록을 채운다
window.onCalTypeChange = function() {
  const type = document.getElementById('cal_type').value;
  const field = document.getElementById('cal_contract_field');
  if (!field) return;
  if (type !== 'delivery') {
    field.style.display = 'none';
    return;
  }
  field.style.display = 'block';
  const sel = document.getElementById('cal_contract');
  const contracts = window._contracts || {};
  const options = Object.entries(contracts)
    .filter(([, c]) => c && c.buyer_name)
    .sort(([, a], [, b]) => (b.created_at || '').localeCompare(a.created_at || ''))
    .map(([id, c]) => `<option value="${id}">${c.buyer_name} 님 (${c.femaleCode || ''}×${c.maleCode || ''})</option>`)
    .join('');
  sel.innerHTML = '<option value="">-- 계약 선택 (직접 입력하려면 비워두세요) --</option>' + options;
};

// 계약을 선택하면 제목/날짜/주소/상세내용을 자동으로 채운다
window.onCalContractSelect = function() {
  const contractId = document.getElementById('cal_contract').value;
  if (!contractId) return;
  const c = (window._contracts || {})[contractId];
  if (!c) return;

  const dogLabel = `${c.femaleCode || ''}×${c.maleCode || ''}`;
  document.getElementById('cal_title').value = `🚚 [배송] ${c.buyer_name || ''} 님 (${dogLabel})`;
  if (c.balance_date) document.getElementById('cal_date').value = c.balance_date;
  document.getElementById('cal_location').value = [c.buyer_addr || '', c.buyer_addr_detail || ''].filter(Boolean).join(' ');
  document.getElementById('cal_details').value = `수령인: ${c.buyer_name || ''} (${c.buyer_phone || ''}) | 강아지: ${dogLabel} | 계약ID: ${contractId}`;
};

window.saveAddEvent = async function() {
  const type = document.getElementById('cal_type').value;
  const title = document.getElementById('cal_title').value.trim();
  const date = document.getElementById('cal_date').value;
  const time = document.getElementById('cal_time')?.value || '';
  const location = document.getElementById('cal_location').value.trim();
  const details = document.getElementById('cal_details').value.trim();
  const contractEl = document.getElementById('cal_contract');
  const contractId = contractEl ? contractEl.value : '';

  if (!title || !date) {
    toast('일정 제목과 일시를 입력해주세요.');
    return;
  }

  const payload = { type, title, date, time, location, details, createdAt: Date.now() };
  if (contractId) {
    const c = (window._contracts || {})[contractId];
    if (c) {
      payload.contractId = contractId;
      payload.buyer_name = c.buyer_name || '';
      payload.buyer_phone = c.buyer_phone || '';
    }
  }

  const newRef = fbPush(ref(db, 'schedules'));
  await update(newRef, payload);
  closeModal();
  toast('새 일정이 등록되었습니다!');
};

window.deleteCalendarEvent = async function(dbPath) {
  if (!dbPath) return;

  // 계약서(/contracts)에서 파생된 "잔금 납부일" 일정은 계약서 자체를 삭제하면 안 되므로
  // 잔금납부일 필드만 비우는 방식으로 안전하게 처리
  if (dbPath.startsWith('contracts/')) {
    if (confirm('이 일정은 계약서의 "잔금 납부일" 정보로 자동 생성된 항목입니다.\n계약서 자체는 삭제되지 않고, 잔금 납부일만 비워집니다.\n계속하시겠습니까?')) {
      await update(ref(db, dbPath), { balance_date: '' });
      toast('잔금 납부일 일정이 삭제(비움) 처리되었습니다.');
    }
    return;
  }

  if (confirm('이 일정을 삭제하시겠습니까?')) {
    await fbRemove(ref(db, dbPath));
    toast('일정이 삭제되었습니다.');
  }
};
</script>
