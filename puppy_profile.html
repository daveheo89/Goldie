<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>골디쉼터 - 고화질 강아지 분양 프로필</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-p: #D4AF37;
      --gold-light: #FDFBF7;
      --brown-dark: #3E2723;
      --brown-mid: #5D4037;
      --accent: #E65100;
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #475569;
      --border: #E2E8F0;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding-bottom: 90px;
      line-height: 1.5;
    }
    .profile-container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card-bg);
      min-height: 100vh;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      position: relative;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .brand-logo {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--brown-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hero-slider {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 0 0 24px 24px;
      overflow: hidden;
      background: #0F172A;
      touch-action: pan-y;
    }
    .slide-track {
      display: flex;
      height: 100%;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .slide-item {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      position: relative;
    }
    .slide-item img, .slide-item video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .slide-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.45);
      color: #fff;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    .slide-arrow.prev { left: 10px; }
    .slide-arrow.next { right: 10px; }
    .slide-indicator {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: rgba(15, 23, 42, 0.75);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 12px;
      z-index: 10;
      pointer-events: none;
    }
    .thumb-nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 12px;
      margin-bottom: 8px;
    }
    .thumb-nav::-webkit-scrollbar { display: none; }
    .thumb-item {
      flex: none;
      width: 60px;
      height: 60px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s, border-color 0.2s;
    }
    .thumb-item.active {
      border-color: var(--gold-p);
      opacity: 1;
    }
    .thumb-video-wrap {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .thumb-play-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 12px;
      font-weight: bold;
    }
    .puppy-info-body {
      padding: 20px;
    }
    .puppy-badge-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .badge-status {
      background: linear-gradient(135deg, var(--gold-p), #B8860B);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .puppy-title {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--brown-dark);
      margin-bottom: 6px;
    }
    .puppy-meta {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 16px;
    }
    .price-box {
      background: var(--gold-light);
      border: 1px solid #E8DCC8;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price-val {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent);
    }
    .parent-sec-title {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--brown-dark);
      margin-bottom: 12px;
      margin-top: 24px;
    }
    .parent-card {
      background: #F1F5F9;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .parent-header {
      padding: 10px 14px;
      background: var(--brown-dark);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .bottom-cta {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      z-index: 1000;
    }
    .cta-btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .cta-btn.share {
      background: #F1F5F9;
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .cta-btn.kakao {
      background: #FEE500;
      color: #000;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img, .lightbox video { max-width: 95%; max-height: 85vh; border-radius: 8px; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const FB = {
      apiKey: "AIzaSyBYR0-f6YVw_pGSlfOqPNP_UyT_VcHWntk",
      authDomain: "goldie-shelter-d6c81.firebaseapp.com",
      databaseURL: "https://goldie-shelter-d6c81-default-rtdb.firebaseio.com",
      projectId: "goldie-shelter-d6c81",
      storageBucket: "goldie-shelter-d6c81.firebasestorage.app",
      messagingSenderId: "1071275996614",
      appId: "1:1071275996614:web:e39eb145b23ea6e02ae947"
    };
    const app = initializeApp(FB);
    const db  = getDatabase(app);

    const params = new URLSearchParams(location.search);
    const litterKey = params.get('litter');
    const puppyId   = params.get('puppy');

    window._currentPuppyData = null;
    window._totalSlides = 0;
    window._currentSlide = 0;

    // ── 공통 미디어 정렬 헬퍼 (order 필드 우선) ──
    function getSortedMedia(p) {
      if (!p || !p.media) return [];
      const list = Object.entries(p.media).map(([k, v]) => ({ _key: k, ...v }));
      return list.sort((a, b) => {
        const ao = (a.order !== undefined && a.order !== null) ? a.order : null;
        const bo = (b.order !== undefined && b.order !== null) ? b.order : null;
        if (ao !== null && bo !== null) return ao - bo;
        if (ao !== null) return -1;
        if (bo !== null) return 1;
        return String(a.createdAt || a._key).localeCompare(String(b.createdAt || b._key));
      });
    }
    window.getSortedMedia = getSortedMedia;

    window.goToSlide = function(idx) {
      const track = document.getElementById('heroSlideTrack');
      const indicator = document.getElementById('slideIndicator');
      const slider = document.getElementById('heroSlider');
      
      if (!track || !window._totalSlides) return;
      if (idx < 0) idx = window._totalSlides - 1;
      if (idx >= window._totalSlides) idx = 0;
      
      window._currentSlide = idx;
      track.style.transform = `translateX(-${idx * 100}%)`;

      // Pause playing videos on slide change
      if (slider) {
        slider.querySelectorAll('video').forEach(v => {
          try { v.pause(); } catch(e){}
        });
      }

      if (indicator) {
        indicator.textContent = `${idx + 1} / ${window._totalSlides}`;
      }

      const thumbs = document.querySelectorAll('#thumbNav .thumb-item');
      thumbs.forEach((t, i) => t.classList.toggle('active', i === idx));
    };

    window.prevSlide = function() { window.goToSlide(window._currentSlide - 1); };
    window.nextSlide = function() { window.goToSlide(window._currentSlide + 1); };

    let currentSireSlide = 0;
    window.prevSireSlide = function(e) {
      if (e) e.stopPropagation();
      const track = document.getElementById('sireSlideTrack');
      if (!track) return;
      currentSireSlide = Math.max(0, currentSireSlide - 1);
      track.style.transform = `translateX(-${currentSireSlide * 100}%)`;
    };
    window.nextSireSlide = function(e) {
      if (e) e.stopPropagation();
      const track = document.getElementById('sireSlideTrack');
      if (!track) return;
      currentSireSlide++;
      track.style.transform = `translateX(-${currentSireSlide * 100}%)`;
    };

    let currentDamSlide = 0;
    window.prevDamSlide = function(e) {
      if (e) e.stopPropagation();
      const track = document.getElementById('damSlideTrack');
      if (!track) return;
      currentDamSlide = Math.max(0, currentDamSlide - 1);
      track.style.transform = `translateX(-${currentDamSlide * 100}%)`;
    };
    window.nextDamSlide = function(e) {
      if (e) e.stopPropagation();
      const track = document.getElementById('damSlideTrack');
      if (!track) return;
      currentDamSlide++;
      track.style.transform = `translateX(-${currentDamSlide * 100}%)`;
    };

    async function loadProfile() {
      if (!litterKey || !puppyId) {
        alert('잘못된 프로필 접근입니다.');
        return;
      }
      try {
        const ltSnap = await get(ref(db, `litters/${litterKey}`));
        if (!ltSnap.exists()) return;
        const lt = ltSnap.val();
        const p = (lt.puppies && lt.puppies[puppyId]) ? lt.puppies[puppyId] : null;
        if (!p) return;

        let sireData = null, damData = null;
        if (p.sireCode) {
          const sSnap = await get(ref(db, `males/${p.sireCode}`));
          if (sSnap.exists()) sireData = sSnap.val();
        }
        if (p.damCode) {
          const dSnap = await get(ref(db, `females/${p.damCode}`));
          if (dSnap.exists()) damData = dSnap.val();
        }

        window._currentPuppyData = { lt, p, sireData, damData };
        renderProfile(lt, p, sireData, damData);
        initSwipeEvents();
      } catch(err) {
        console.error('프로필 로딩 오류:', err);
      }
    }
    window.loadProfile = loadProfile;

    function renderProfile(lt, p, sireData, damData) {
      const container = document.getElementById('hero-container');
      
      // 📷/🎥 미디어 통합 order 순서 정렬 (사진+영상 통합 배열)
      let sortedMediaList = getSortedMedia(p);
      let allSlideMedia = [];

      if (sortedMediaList.length > 0) {
        allSlideMedia = sortedMediaList;
      } else if (p.photo) {
        allSlideMedia = [{ type: 'image', src: p.photo, order: 0 }];
      }

      window._totalSlides = allSlideMedia.length;
      let sliderHtml = '';
      let thumbsHtml = '';

      if (allSlideMedia.length > 0) {
        const slides = allSlideMedia.map((m, idx) => {
          const isVideo = m.type === 'video' || (m.src && (m.src.includes('.mp4') || m.src.includes('.mov')));
          const isExternal = m.src && (m.src.includes('youtube.com') || m.src.includes('youtu.be') || m.src.includes('photos.app.goo.gl'));

          if (isExternal) {
            return `
              <div class="slide-item" data-idx="${idx}">
                <div style="width:100%;height:100%;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px;text-align:center;">
                  <div style="font-size:2.5rem;margin-bottom:8px;">🎥</div>
                  <div style="font-size:0.9rem;font-weight:bold;margin-bottom:12px;">외부 영상 보러가기</div>
                  <button class="pd-profile-btn" style="background:#3B82F6;" onclick="window.open('${m.src}', '_blank')">▶ 영상 열기</button>
                </div>
              </div>
            `;
          } else if (isVideo) {
            return `
              <div class="slide-item" data-idx="${idx}">
                <video src="${m.src}" preload="metadata" playsinline controls style="width:100%;height:100%;object-fit:contain;background:#000;"></video>
              </div>
            `;
          } else {
            return `
              <div class="slide-item" data-idx="${idx}">
                <img src="${m.src}" alt="${p.name || '골든리트리버'}" style="width:100%;height:100%;object-fit:contain;background:#1a1a1a;" onclick="openProfileLightbox('${m.src}', 'image')">
              </div>
            `;
          }
        }).join('');

        thumbsHtml = allSlideMedia.map((m, idx) => {
          const isVideo = m.type === 'video' || (m.src && (m.src.includes('.mp4') || m.src.includes('.mov')));
          if (isVideo) {
            return `
              <div class="thumb-item ${idx === 0 ? 'active' : ''}" onclick="goToSlide(${idx})">
                <div class="thumb-video-wrap">
                  <video src="${m.src}#t=0.5" preload="metadata" playsinline muted style="width:100%;height:100%;object-fit:cover;pointer-events:none;"></video>
                  <div class="thumb-play-icon">▶</div>
                </div>
              </div>
            `;
          } else {
            return `
              <div class="thumb-item ${idx === 0 ? 'active' : ''}" onclick="goToSlide(${idx})">
                <img src="${m.src}" style="width:100%;height:100%;object-fit:cover;">
              </div>
            `;
          }
        }).join('');

        sliderHtml = `
          <div class="hero-slider" id="heroSlider">
            <span class="zoom-hint" style="position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.5);color:#fff;font-size:10px;padding:3px 8px;border-radius:10px;z-index:5;">🔍 터치 확대</span>
            <div class="slide-track" id="heroSlideTrack">${slides}</div>
            ${allSlideMedia.length > 1 ? '<button class="slide-arrow prev" onclick="prevSlide()">◀</button><button class="slide-arrow next" onclick="nextSlide()">▶</button>' : ''}
            <div class="slide-indicator" id="slideIndicator">1 / ${allSlideMedia.length}</div>
          </div>
          ${allSlideMedia.length > 1 ? `<div class="thumb-nav" id="thumbNav">${thumbsHtml}</div>` : ''}
        `;
      } else {
        sliderHtml = `
          <div class="hero-slider" style="background:var(--gold-p);display:flex;align-items:center;justify-content:center;">
            <div style="font-size:4rem;">🐕</div>
          </div>
        `;
      }

      container.innerHTML = sliderHtml;

      // 텍스트 정보 채우기
      document.getElementById('puppy-name').textContent = p.name || '골든리트리버 강아지';
      document.getElementById('puppy-status').textContent = p.status || '분양가능';
      document.getElementById('puppy-meta').textContent = `${p.sex === 'female' ? '공주님 (암컷)' : '왕자님 (수컷)'} • ${p.color || '골든'} • 출생일: ${lt.birthDate || '미정'}`;
      document.getElementById('puppy-price').textContent = p.price ? `${p.price} 만원` : '문의';
      document.getElementById('puppy-notes').textContent = p.notes || '사랑스러운 골든리트리버 강아지입니다.';

      // 부모견 카드 렌더링
      renderParentCards(p, sireData, damData);
    }

    function renderParentCards(p, sireData, damData) {
      const area = document.getElementById('parents-area');
      let html = '';

      if (p.showSire !== false && sireData) {
        html += `
          <div class="parent-card">
            <div class="parent-header">👑 부견 (Father): ${sireData.name || p.sireCode}</div>
            <div style="padding:10px;">
              <img src="${sireData.photo || ''}" style="width:100%;max-height:200px;object-fit:contain;background:#1a1a1a;border-radius:8px;">
            </div>
          </div>
        `;
      }
      if (p.showDam !== false && damData) {
        html += `
          <div class="parent-card">
            <div class="parent-header">🎀 모견 (Mother): ${damData.name || p.damCode}</div>
            <div style="padding:10px;">
              <img src="${damData.photo || ''}" style="width:100%;max-height:200px;object-fit:contain;background:#1a1a1a;border-radius:8px;">
            </div>
          </div>
        `;
      }
      area.innerHTML = html;
    }

    function initSwipeEvents() {
      const slider = document.getElementById('heroSlider');
      if (!slider) return;

      let startX = 0, startY = 0;
      let isDragging = false;

      slider.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isDragging = true;
      }, { passive: true });

      slider.addEventListener('touchend', e => {
        if (!isDragging) return;
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;
        const diffX = startX - endX;
        const diffY = startY - endY;

        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 35) {
          if (diffX > 0) window.nextSlide();
          else window.prevSlide();
        }
        isDragging = false;
      }, { passive: true });
    }

    window.openProfileLightbox = function(src, type) {
      const target = document.getElementById('lightboxTarget');
      if (type === 'video') {
        target.innerHTML = `<video src="${src}" controls autoplay playsinline style="max-width:100%;max-height:85vh;"></video>`;
      } else {
        target.innerHTML = `<img src="${src}">`;
      }
      document.getElementById('lightbox').classList.add('open');
    };

    window.closeLightbox = function() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lightboxTarget').innerHTML = '';
    };

    window.shareProfileToKakao = async function() {
      const url = location.href;
      const data = window._currentPuppyData;
      const name = data && data.p ? data.p.name : '골디 강아지';
      const shareText = `[골디쉼터] 🐾 ${name} 분양 프로필 안내\n\n아래 링크에서 사진과 동영상을 확인해 보세요!\n${url}`;

      if (navigator.share) {
        try {
          await navigator.share({ title: `[골디쉼터] 🐾 ${name} 프로필`, text: shareText });
          return;
        } catch(e){}
      }

      try {
        await navigator.clipboard.writeText(url);
        alert('📋 카톡 공유용 프로필 주소가 복사되었습니다! 대화방에 붙여넣어 전송하세요.');
      } catch(e){
        prompt('아래 프로필 주소를 복사하세요:', url);
      }
    };

    window.inquireKakao = function() {
      const data = window._currentPuppyData;
      const name = data && data.p ? data.p.name : '강아지';
      const url = location.href;
      const msg = encodeURIComponent(`안녕하세요! 골디쉼터 분양 웹페이지를 보고 문의드립니다.\n\n🐾 강아지: ${name}\n🔗 프로필 주소: ${url}`);
      window.open(`https://open.kakao.com/me/goldieshelter?text=${msg}`, '_blank');
    };

    window.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</head>
<body>
  <div class="profile-container">
    <div class="top-bar">
      <div class="brand-logo">🐾 골디쉼터</div>
      <div style="font-size:0.8rem;color:var(--text-sub);">프리미엄 골든리트리버</div>
    </div>

    <div id="hero-container">
      <div class="hero-slider" style="background:#F1F5F9;display:flex;align-items:center;justify-content:center;">
        <div style="color:#64748B;font-size:0.9rem;">프로필 정보를 불러오는 중입니다...</div>
      </div>
    </div>

    <div class="puppy-info-body">
      <div class="puppy-badge-wrap">
        <span class="badge-status" id="puppy-status">분양가능</span>
      </div>
      <h1 class="puppy-title" id="puppy-name">강아지 프로필</h1>
      <div class="puppy-meta" id="puppy-meta">로딩 중...</div>

      <div class="price-box">
        <span style="font-weight:700;color:var(--brown-dark);">분양 금액</span>
        <span class="price-val" id="puppy-price">문의</span>
      </div>
