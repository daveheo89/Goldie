<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="data:image/svg+xml,%3CSvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Ctext%20y=%22.9em%22%20font-size=%2290%22%3E🐕%3C/text%3E%3C/svg%3E">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>골디쉼터 - 분양 프로필</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --primary: #D97706;
      --primary-light: #FEF3C7;
      --border: #E2E8F0;
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding-bottom: 90px; }
    .app-container { width: 100%; max-width: 480px; background: var(--card-bg); min-height: 100vh; position: relative; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }

    /* Header */
    .header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 50; }
    .brand-logo { font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }

    /* Main Slider */
    .media-slider-container { position: relative; width: 100%; aspect-ratio: 4/5; background: #000; overflow: hidden; }
    .slider-track { display: flex; width: 100%; height: 100%; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
    .slide-item { flex: 0 0 100%; width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
    .slide-item img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
    .slide-item video { width: 100%; height: 100%; object-fit: cover; }
    
    .slider-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; background: rgba(15,23,42,0.6); color: #FFF; border: none; border-radius: 50%; font-size: 15px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; backdrop-filter: blur(4px); }
    .slider-nav-btn.prev { left: 12px; }
    .slider-nav-btn.next { right: 12px; }
    .slider-counter { position: absolute; bottom: 12px; right: 12px; background: rgba(15,23,42,0.75); color: #FFF; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 12px; z-index: 10; backdrop-filter: blur(4px); }

    /* Info Grid (4개 필수 요소) */
    .content-body { padding: 24px 20px; }
    .section-title { font-size: 0.9rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
    
    .info-card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .info-card { background: #F1F5F9; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .info-card .label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }
    .info-card .value { font-size: 1rem; font-weight: 900; color: var(--text-main); }

    /* Parent Cards (부모견 슬라이더) */
    .parent-container { margin-top: 16px; display: flex; flex-direction: column; gap: 16px; }
    .parent-card { background: #FFFFFF; border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
    .parent-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .parent-role { font-size: 0.85rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 6px; }
    .parent-code { font-size: 0.9rem; font-weight: 900; color: var(--text-main); }

    .parent-slider { position: relative; width: 100%; aspect-ratio: 4/5; background: #000; border-radius: 12px; overflow: hidden; }
    .parent-slider .slide-item img,
    .parent-slider .slide-item video { width: 100%; height: 100%; object-fit: cover; background: #0F172A; cursor: zoom-in; }

    /* Lightbox Modal */
    .lightbox-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; }
    .lightbox-modal.open { display: flex; opacity: 1; }
    .lightbox-viewport { position: relative; width: 100%; height: 85vh; overflow: hidden; touch-action: pan-y; }
    .lightbox-track { display: flex; width: 100%; height: 100%; transition: transform 0.25s ease; }
    .lb-slide { flex: 0 0 100%; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .lb-slide img, .lb-slide video { max-width: 95vw; max-height: 85vh; object-fit: contain; }
    .lightbox-close { position: absolute; top: 20px; right: 20px; color: #FFF; font-size: 28px; background: rgba(255,255,255,0.12); border: none; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 20; }
    .lightbox-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; background: rgba(255,255,255,0.12); color: #FFF; border: none; border-radius: 50%; font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 20; }
    .lightbox-nav-btn.prev { left: 12px; }
    .lightbox-nav-btn.next { right: 12px; }

    /* Bottom CTA Bar */
    .bottom-cta-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; padding: 12px 20px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; gap: 10px; z-index: 60; }
    .cta-btn { flex: 1; height: 50px; border-radius: 14px; font-size: 0.95rem; font-weight: 800; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; }
    .cta-btn.share { background: #F1F5F9; color: var(--text-main); }
    .cta-btn.kakao { background: #FEE500; color: #191919; }

    /* Loading Spinner */
    #loading-overlay { position: fixed; inset: 0; background: #FFF; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; gap: 12px; }
    .spinner { width: 36px; height: 36px; border: 3px solid #E2E8F0; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div style="font-size:13px; font-weight:700; color:#64748B;">프로필을 불러오는 중...</div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand-logo">GOLDIE SHELTER</div>
      <div style="font-size:12px; font-weight:800; color:var(--text-muted);">공개 분양 프로필</div>
    </header>

    <!-- ① 메인 미디어 슬라이더 (사진/영상 order 통합 정렬) -->
    <div class="media-slider-container">
      <div class="slider-track" id="main-slider-track"></div>
      <button class="slider-nav-btn prev" onclick="moveMainSlide(-1)">◀</button>
      <button class="slider-nav-btn next" onclick="moveMainSlide(1)">▶</button>
      <div class="slider-counter" id="main-slider-counter">1 / 1</div>
    </div>

    <div class="content-body">
      <!-- ② 출생일 / ③ 성별 카드 -->
      <div class="section-title">📌 기본 정보</div>
      <div class="info-card-grid">
        <div class="info-card">
          <div class="label">📅 출생일</div>
          <div class="value" id="disp-birth">-</div>
        </div>
        <div class="info-card">
          <div class="label">🐾 성별</div>
          <div class="value" id="disp-sex">-</div>
        </div>
      </div>

      <!-- ④ 관리자 설정 시에만 노출되는 부/모견 슬라이드 -->
      <div id="parent-section-wrap" style="display:none;">
        <div class="section-title">🐕‍🦺 부/모견 정보</div>
        <div class="parent-container" id="parent-cards-container"></div>
      </div>
    </div>

    <!-- 하단 고정 CTA (공유 / 카카오톡) -->
    <div class="bottom-cta-bar">
      <button class="cta-btn share" onclick="shareProfile()">🔗 링크 공유</button>
      <a class="cta-btn kakao" id="kakao-btn" href="https://open.kakao.com/o/sxGtK0ri" target="_blank">💬 카카오톡 문의</a>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox-modal" id="lightbox-modal" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="event.stopPropagation(); closeLightbox()">✕</button>
    <button class="lightbox-nav-btn prev" onclick="event.stopPropagation(); moveLightbox(-1)">◀</button>
    <button class="lightbox-nav-btn next" onclick="event.stopPropagation(); moveLightbox(1)">▶</button>
    <div class="lightbox-viewport" id="lightbox-viewport" onclick="event.stopPropagation()">
      <div class="lightbox-track" id="lightbox-track"></div>
    </div>
    <div class="slider-counter" id="lightbox-counter" style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);"></div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Standardized Firebase Config (goldie_farm.html과 동일)
    const firebaseConfig = {
      databaseURL: "https://goldie-shelter-d6c81-default-rtdb.firebaseio.com",
      projectId: "goldie-shelter-d6c81",
      storageBucket: "goldie-shelter-d6c81.firebasestorage.app",
      messagingSenderId: "1071275996614",
      appId: "1:1071275996614:web:8d88e0ec0e729a67448e89"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let mainSlides = [];
    let currentMainIdx = 0;
    let touchStartX = 0;

    // 이름/코드 정규화 헬퍼 (goldie_farm.html과 동일)
    function cleanDogName(raw) {
      if (!raw) return '';
      const s = String(raw).trim();
      return s.includes('/') ? s.split('/')[0].trim() : s;
    }

    function fmtDate(str) {
      if (!str) return '-';
      const clean = str.replace(/[^0-9]/g, '');
      if (clean.length === 8) {
        return `${clean.slice(0,4)}.${clean.slice(4,6)}.${clean.slice(6,8)}`;
      }
      return str.replace(/-/g, '.');
    }

    function getSortedMedia(p) {
      const list = [];
      const seen = new Set();
      // 대표 사진(photo)은 개체 등록 시 가장 먼저 올리는 메인 사진이라, media 갤러리가
      // 나중에 추가되었더라도 항상 포함시키고 항상 맨 앞(메인)에 오도록 고정한다.
      // (기존엔 media가 하나라도 있으면 photo를 아예 무시해버리는 버그가 있었음)
      if (p.photo) {
        list.push({ type: 'image', src: p.photo, order: -1 });
        seen.add(p.photo);
      }
      if (p.media && Object.keys(p.media).length) {
        Object.entries(p.media).forEach(([k, v]) => {
          if (v && v.src && !seen.has(v.src)) {
            seen.add(v.src);
            list.push({
              _key: k,
              type: v.type || 'image',
              src: v.src,
              order: (typeof v.order === 'number') ? v.order : 999
            });
          }
        });
      }
      return list.sort((a, b) => a.order - b.order);
    }

    async function initProfile() {
      const urlParams = new URLSearchParams(window.location.search);
      const litterKey = urlParams.get('litterKey') || urlParams.get('litter');
      const puppyId = urlParams.get('puppyId') || urlParams.get('puppy');

      if (!litterKey || !puppyId) {
        document.getElementById('loading-overlay').innerHTML = '<div style="padding:20px; text-align:center; font-weight:bold;">잘못된 접근 주소입니다.</div>';
        return;
      }

      try {
        const [litterSnap, malesSnap, femalesSnap] = await Promise.all([
          get(ref(db, `litters/${litterKey}`)),
          get(ref(db, 'males')),
          get(ref(db, 'females'))
        ]);

        if (!litterSnap.exists()) {
          document.getElementById('loading-overlay').innerHTML = '<div style="padding:20px; text-align:center;">강아지 정보를 찾을 수 없습니다.</div>';
          return;
        }

        const lt = litterSnap.val();
        const p = (lt.puppies || {})[puppyId];

        if (!p) {
          document.getElementById('loading-overlay').innerHTML = '<div style="padding:20px; text-align:center;">삭제되거나 존재하지 않는 강아지입니다.</div>';
          return;
        }

        // ① 메인 슬라이더 렌더링 (order 순서 정렬)
        mainSlides = getSortedMedia(p);
        renderMainSlider();

        // ② 출생일 표시 (lt.birthB || lt.birthA)
        document.getElementById('disp-birth').textContent = fmtDate(lt.birthB || lt.birthA);

        // ③ 성별 표시
        document.getElementById('disp-sex').textContent = p.sex === 'female' ? '♀ 암컷 (공주님)' : p.sex === 'male' ? '♂ 수컷 (왕자님)' : '미정';

        // ④ 부/모견 정규화 매칭 및 노출 설정 판단
        const malesMap = {};
        if (malesSnap.exists()) {
          malesSnap.forEach(c => {
            const v = c.val();
            const cleaned = cleanDogName(v.code);
            if (cleaned) malesMap[cleaned] = { _key: c.key, ...v };
          });
        }

        const femalesMap = {};
        if (femalesSnap.exists()) {
          femalesSnap.forEach(c => {
            const v = c.val();
            const cleaned = cleanDogName(v.code);
            if (cleaned) femalesMap[cleaned] = { _key: c.key, ...v };
          });
        }

        const maleCleanCode = cleanDogName(lt.maleCode);
        const femaleCleanCode = cleanDogName(lt.femaleCode);

        const sireData = malesMap[maleCleanCode];
        const damData = femalesMap[femaleCleanCode];

        const showSire = p.showSireInProfile !== false;
        const showDam = p.showDamInProfile !== false;

        const parentContainer = document.getElementById('parent-cards-container');
        parentContainer.innerHTML = '';
        let parentCount = 0;

        if (showSire && (sireData || lt.maleCode)) {
          parentCount++;
          parentContainer.appendChild(renderParentCard('🐕 부견 (아빠)', lt.maleCode || '부견', sireData, 'sire'));
        }

        if (showDam && (damData || lt.femaleCode)) {
          parentCount++;
          parentContainer.appendChild(renderParentCard('🐕‍🦺 모견 (엄마)', lt.femaleCode || '모견', damData, 'dam'));
        }

        if (parentCount > 0) {
          document.getElementById('parent-section-wrap').style.display = 'block';
        }

        document.getElementById('loading-overlay').style.display = 'none';

      } catch (err) {
        console.error('Profile load error:', err);
        document.getElementById('loading-overlay').innerHTML = `<div style="padding:20px; text-align:center;">오류가 발생했습니다: ${err.message}</div>`;
      }
    }

    function renderMainSlider() {
      const track = document.getElementById('main-slider-track');
      track.innerHTML = '';

      if (!mainSlides.length) {
        track.innerHTML = '<div class="slide-item" style="color:#FFF;">등록된 미디어가 없습니다.</div>';
        document.getElementById('main-slider-counter').textContent = '0 / 0';
        return;
      }

      mainSlides.forEach((m, idx) => {
        const item = document.createElement('div');
        item.className = 'slide-item';

        if (m.type === 'video' || (m.src && (m.src.includes('.mp4') || m.src.includes('.mov')))) {
          item.innerHTML = `<video src="${m.src}" controls preload="metadata" playsinline></video>`;
        } else {
          item.innerHTML = `<img src="${m.src}" alt="Puppy Photo" onclick="openLightboxGallery('main', ${idx})">`;
        }

        track.appendChild(item);
      });

      // Swiping listeners
      const container = document.querySelector('.media-slider-container');
      container.ontouchstart = (e) => { touchStartX = e.touches[0].clientX; };
      container.ontouchend = (e) => {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) {
          moveMainSlide(diff > 0 ? 1 : -1);
        }
      };

      updateMainSlidePosition();
    }

    window.moveMainSlide = function(dir) {
      if (!mainSlides.length) return;
      currentMainIdx = (currentMainIdx + dir + mainSlides.length) % mainSlides.length;
      updateMainSlidePosition();
    };

    function updateMainSlidePosition() {
      const track = document.getElementById('main-slider-track');
      if (track) {
        track.style.transform = `translateX(-${currentMainIdx * 100}%)`;
      }

      // Pause playing videos on slide change
      document.querySelectorAll('#main-slider-track video').forEach(v => v.pause());

      document.getElementById('main-slider-counter').textContent = `${currentMainIdx + 1} / ${mainSlides.length}`;
    }

    const parentMediaCache = { sire: [], dam: [] };

    function renderParentCard(roleTitle, codeTitle, dogData, roleKey) {
      const card = document.createElement('div');
      card.className = 'parent-card';

      const parentMedia = getSortedMedia(dogData || {});
      parentMediaCache[roleKey] = parentMedia;

      let parentMediaHtml = '<div style="aspect-ratio:4/3; background:#F1F5F9; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#94A3B8; font-size:13px; font-weight:bold;">📷 대표 사진 준비 중</div>';

      if (parentMedia.length > 0) {
        const pSlides = parentMedia.map((m, idx) => {
          if (m.type === 'video' || (m.src && (m.src.includes('.mp4') || m.src.includes('.mov')))) {
            return `<div class="slide-item"><video src="${m.src}" controls preload="metadata" playsinline></video></div>`;
          }
          return `<div class="slide-item"><img src="${m.src}" alt="${roleTitle}" onclick="openLightboxGallery('${roleKey}', ${idx})"></div>`;
        }).join('');

        parentMediaHtml = `
          <div class="parent-slider" id="parent-slider-${roleKey}">
            <div class="slider-track" id="parent-track-${roleKey}" style="display:flex; width:100%; height:100%; transition:transform 0.3s ease;">
              ${pSlides}
            </div>
            ${parentMedia.length > 1 ? `
              <button class="slider-nav-btn prev" onclick="moveParentSlide('${roleKey}', -1)">◀</button>
              <button class="slider-nav-btn next" onclick="moveParentSlide('${roleKey}', 1)">▶</button>
              <div class="slider-counter" id="parent-counter-${roleKey}">1 / ${parentMedia.length}</div>
            ` : ''}
          </div>
        `;
      }

      card.innerHTML = `
        <div class="parent-header">
          <div class="parent-role">${roleTitle}</div>
          <div class="parent-code">${codeTitle}</div>
        </div>
        ${parentMediaHtml}
      `;

      if (parentMedia.length > 1) {
        setTimeout(() => {
          const slider = card.querySelector(`#parent-slider-${roleKey}`);
          if (!slider) return;
          let startX = 0;
          slider.ontouchstart = (e) => { startX = e.touches[0].clientX; };
          slider.ontouchend = (e) => {
            const diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 40) moveParentSlide(roleKey, diff > 0 ? 1 : -1);
          };
        }, 0);
      }

      return card;
    }

    const parentIndices = { sire: 0, dam: 0 };

    window.moveParentSlide = function(roleKey, dir) {
      const track = document.getElementById(`parent-track-${roleKey}`);
      if (!track) return;
      const total = track.children.length;
      if (total <= 1) return;

      parentIndices[roleKey] = (( (parentIndices[roleKey] || 0) + dir) % total + total) % total;
      track.style.transform = `translateX(-${parentIndices[roleKey] * 100}%)`;

      const counter = document.getElementById(`parent-counter-${roleKey}`);
      if (counter) counter.textContent = `${parentIndices[roleKey] + 1} / ${total}`;
    };

    // ── 라이트박스: 탭한 사진이 속한 갤러리 전체를 확대화면에서 스와이프로 넘겨보기 ──
    let lbGallery = [];
    let lbIdx = 0;
    let lbTouchStartX = 0;

    function getLbGallery(source) {
      if (source === 'main') return mainSlides;
      return parentMediaCache[source] || [];
    }

    window.openLightboxGallery = function(source, idx) {
      lbGallery = getLbGallery(source);
      lbIdx = idx;
      if (!lbGallery.length) return;
      renderLightboxSlides();
      const modal = document.getElementById('lightbox-modal');
      if (modal) modal.classList.add('open');
    };

    function renderLightboxSlides() {
      const track = document.getElementById('lightbox-track');
      if (!track) return;
      track.innerHTML = lbGallery.map(m => {
        if (m.type === 'video' || (m.src && (m.src.includes('.mp4') || m.src.includes('.mov')))) {
          return `<div class="lb-slide"><video src="${m.src}" controls preload="metadata" playsinline></video></div>`;
        }
        return `<div class="lb-slide"><img src="${m.src}" alt=""></div>`;
      }).join('');
      updateLightboxPosition();
    }

    function updateLightboxPosition() {
      const track = document.getElementById('lightbox-track');
      if (track) track.style.transform = `translateX(-${lbIdx * 100}%)`;
      document.querySelectorAll('#lightbox-track video').forEach(v => v.pause());
      const counter = document.getElementById('lightbox-counter');
      if (counter) {
        if (lbGallery.length > 1) {
          counter.textContent = `${lbIdx + 1} / ${lbGallery.length}`;
          counter.style.display = 'block';
        } else {
          counter.style.display = 'none';
        }
      }
    }

    window.moveLightbox = function(dir) {
      if (!lbGallery.length) return;
      lbIdx = ((lbIdx + dir) % lbGallery.length + lbGallery.length) % lbGallery.length;
      updateLightboxPosition();
    };

    window.closeLightbox = function() {
      const modal = document.getElementById('lightbox-modal');
      if (modal) modal.classList.remove('open');
      document.querySelectorAll('#lightbox-track video').forEach(v => v.pause());
    };

    (function attachLightboxSwipe() {
      const vp = document.getElementById('lightbox-viewport');
      if (!vp) return;
      vp.addEventListener('touchstart', (e) => { lbTouchStartX = e.touches[0].clientX; }, { passive: true });
      vp.addEventListener('touchend', (e) => {
        const diff = lbTouchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) moveLightbox(diff > 0 ? 1 : -1);
      }, { passive: true });
    })();

    window.shareProfile = function() {
      if (navigator.share) {
        navigator.share({
          title: '골디쉼터 분양 프로필',
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href).then(() => {
          alert('프로필 주소가 클립보드에 복사되었습니다.');
        });
      }
    };

    initProfile();
  </script>
</body>
</html>
